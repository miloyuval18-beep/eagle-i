services:
  - type: web
    name: eagle-i
    runtime: node
    plan: starter # 0.5 CPU / 512 MB; matches the plan chosen in the dashboard
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz # answers instantly, so Render knows a new deploy is up without waiting on port detection
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: SOCIAL_CREDENTIALS_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_CONNECT_WEBHOOK_SECRET # Eagle I CRM: payments on companies' Stripe accounts (Connect webhook)
        sync: false
      - key: STRIPE_PRICE_STARTER
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_REDIRECT_URI
        sync: false
      - key: META_ADS_REDIRECT_URI
        sync: false
      - key: GOOGLE_ADS_DEVELOPER_TOKEN
        sync: false
      - key: GOOGLE_ADS_CLIENT_ID
        sync: false
      - key: GOOGLE_ADS_CLIENT_SECRET
        sync: false
      - key: GOOGLE_ADS_REDIRECT_URI
        sync: false
      - key: GOOGLE_GBP_CLIENT_ID
        sync: false
      - key: GOOGLE_GBP_CLIENT_SECRET
        sync: false
      - key: GOOGLE_GBP_REDIRECT_URI
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: RESEND_INBOUND_DOMAIN
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON # Eagle I CRM: Google Workspace email (domain-wide delegation)
        sync: false
      - key: ADMIN_ALERT_EMAIL
        sync: false
      - key: NODE_ENV
        value: production
