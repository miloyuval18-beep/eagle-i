<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Eagle I — Sign In</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf9f6;--bg-card:#ffffff;--bg-soft:#f1efea;
  --ink:#262421;--ink2:#5b5750;--ink3:#726d63;
  --bdr:#e3e0da;--bdr2:#cfcbc3;--bdr-strong:#262421;
  --f:'Nunito Sans',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;-webkit-font-smoothing:antialiased}
.card{width:100%;max-width:400px;background:var(--bg-card);border:1px solid var(--bdr);border-radius:14px;padding:32px 28px;box-shadow:0 2px 4px rgba(38,36,33,.04),0 8px 24px rgba(38,36,33,.07)}
.brand{font-size:26px;font-weight:800;letter-spacing:.5px;text-align:center;margin-bottom:4px;color:var(--ink)}
.tag{font-size:14px;color:var(--ink3);text-align:center;margin-bottom:24px}
.tabs{display:flex;gap:4px;margin-bottom:20px;background:var(--bg-soft);border-radius:9px;padding:4px}
.tab{flex:1;text-align:center;padding:10px;border-radius:6px;cursor:pointer;font-size:15px;font-weight:700;color:var(--ink3);transition:background .15s,color .15s}
.tab.active{background:var(--ink);color:#fff}
label{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin:14px 0 6px}
input,select{width:100%;background:#fff;border:1.5px solid var(--bdr2);border-radius:8px;padding:12px 13px;font-family:var(--f);font-size:16px;color:var(--ink);outline:none}
input:focus,select:focus{border-color:var(--bdr-strong);box-shadow:0 0 0 3px rgba(38,36,33,.08)}
button.primary{width:100%;margin-top:22px;background:var(--ink);color:#fff;border:none;border-radius:8px;padding:14px;font-family:var(--f);font-size:16px;font-weight:700;cursor:pointer}
button.primary:hover{background:#000}
button.primary:disabled{opacity:.5;cursor:not-allowed}
.err{color:var(--ink);background:var(--bg-soft);border:1px solid var(--bdr2);border-radius:8px;padding:10px 12px;font-size:14px;font-weight:600;margin-top:14px;text-align:center;display:none}
.err::before{content:'⚠ '}
.hidden{display:none}
.forgot{display:block;text-align:right;font-size:14px;color:var(--ink2);text-decoration:underline;margin-top:10px}
.terms-row{display:flex;align-items:flex-start;gap:9px;margin-top:18px}
.terms-row input{width:auto;margin-top:3px;accent-color:var(--ink)}
.terms-row label{font-size:14px;font-weight:400;color:var(--ink2);margin:0}
.terms-row a{color:var(--ink);font-weight:600}
.pw-wrap{position:relative}
.pw-wrap input{padding-right:62px}
.pw-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:6px;font-family:var(--f);font-size:13px;font-weight:700;color:var(--ink2);text-decoration:underline}
.pw-toggle:hover{color:var(--ink)}
.pw-mismatch{color:var(--ink);font-size:13px;font-weight:600;margin-top:6px;display:none}
.pw-mismatch::before{content:'⚠ '}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,.tab:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
</style>
</head>
<body>
<div class="card">
  <div class="brand">EAGLE I</div>
  <div class="tag">AI Marketing Command Center</div>
  <div class="tabs">
    <div class="tab active" id="tab-login" onclick="switchTab('login')">Sign In</div>
    <div class="tab" id="tab-signup" onclick="switchTab('signup')">Sign Up</div>
  </div>

  <form id="form-login">
    <label>Email</label>
    <input type="email" id="login-email" required autocomplete="email">
    <label>Password</label>
    <div class="pw-wrap">
      <input type="password" id="login-password" required autocomplete="current-password">
      <button type="button" class="pw-toggle" onclick="togglePw('login-password',this)">Show</button>
    </div>
    <a class="forgot" href="/forgot-password.html">Forgot password?</a>
    <button class="primary" type="submit">Sign In</button>
  </form>

  <form id="form-signup" class="hidden">
    <label>Company Name</label>
    <input type="text" id="signup-company" required>
    <label>Industry</label>
    <select id="signup-industry">
      <option value="home_services">Home Services / Contractor</option>
      <option value="real_estate">Real Estate</option>
      <option value="professional_services">Professional Services</option>
      <option value="retail">Retail</option>
      <option value="other">Other</option>
    </select>
    <label>Email</label>
    <input type="email" id="signup-email" required autocomplete="email">
    <label>Password (min 8 characters)</label>
    <div class="pw-wrap">
      <input type="password" id="signup-password" required minlength="8" autocomplete="new-password">
      <button type="button" class="pw-toggle" onclick="togglePw('signup-password',this)">Show</button>
    </div>
    <label>Confirm Password</label>
    <div class="pw-wrap">
      <input type="password" id="signup-password-confirm" required minlength="8" autocomplete="new-password">
      <button type="button" class="pw-toggle" onclick="togglePw('signup-password-confirm',this)">Show</button>
    </div>
    <div class="pw-mismatch" id="pw-mismatch">Passwords don't match.</div>
    <div class="terms-row">
      <input type="checkbox" id="signup-terms" required>
      <label for="signup-terms">I agree to the <a href="/terms.html" target="_blank">Terms of Service</a> and <a href="/privacy.html" target="_blank">Privacy Policy</a></label>
    </div>
    <button class="primary" type="submit">Create Account</button>
  </form>

  <div class="err" id="err"></div>
</div>

<script>
function switchTab(which){
  document.getElementById('tab-login').classList.toggle('active', which==='login');
  document.getElementById('tab-signup').classList.toggle('active', which==='signup');
  document.getElementById('form-login').classList.toggle('hidden', which!=='login');
  document.getElementById('form-signup').classList.toggle('hidden', which!=='signup');
  document.getElementById('err').style.display='none';
}
function showErr(msg){
  const el=document.getElementById('err');
  el.textContent=msg;
  el.style.display='block';
}
function togglePw(id,btn){
  const el=document.getElementById(id);
  const show=el.type==='password';
  el.type=show?'text':'password';
  btn.textContent=show?'Hide':'Show';
}
function checkPwMatch(){
  const password=document.getElementById('signup-password').value;
  const confirm=document.getElementById('signup-password-confirm').value;
  const mismatch=confirm.length>0 && password!==confirm;
  document.getElementById('pw-mismatch').style.display=mismatch?'block':'none';
  return !mismatch;
}
document.getElementById('signup-password').addEventListener('input', checkPwMatch);
document.getElementById('signup-password-confirm').addEventListener('input', checkPwMatch);
document.getElementById('form-login').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const email=document.getElementById('login-email').value;
  const password=document.getElementById('login-password').value;
  try{
    const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
    const d=await r.json();
    if(!r.ok) return showErr(d.error?.message||'Login failed');
    window.location.href='/';
  }catch(err){showErr('Network error: '+err.message);}
});
document.getElementById('form-signup').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const companyName=document.getElementById('signup-company').value;
  const industry=document.getElementById('signup-industry').value;
  const email=document.getElementById('signup-email').value;
  const password=document.getElementById('signup-password').value;
  const passwordConfirm=document.getElementById('signup-password-confirm').value;
  const acceptedTerms=document.getElementById('signup-terms').checked;
  if(password!==passwordConfirm){ checkPwMatch(); return showErr("Passwords don't match."); }
  if(!acceptedTerms) return showErr('You must accept the Terms of Service and Privacy Policy.');
  try{
    const r=await fetch('/api/auth/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({companyName,industry,email,password,acceptedTerms})});
    const d=await r.json();
    if(!r.ok) return showErr(d.error?.message||'Signup failed');
    window.location.href='/onboarding.html';
  }catch(err){showErr('Network error: '+err.message);}
});
</script>
</body>
</html>
