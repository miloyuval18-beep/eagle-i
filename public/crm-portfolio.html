<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Levi Construction Group</title>
<meta name="description" content="Levi Construction Group: our companies, and the way into each one in the CRM.">
<script>
  // Older links into the CRM (/crm#needs, /crm#calendar…) open the CRM itself, now at /crm/app.
  if (location.hash && location.hash.length > 1) location.replace('/crm/app' + location.hash);
</script>
<link rel="icon" type="image/svg+xml" href="/lcg-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f3f0;--card:#ffffff;--soft:#f0ede6;
  --ink:#16140f;--ink2:#3d3a33;--ink3:#5a554b;
  --bdr:#cfc8b8;--gold:#a8925f;--gold-ink:#7a6638;--black:#0b0b0b;--go:#16140f;--go2:#3d3a33;
  --f:'Nunito Sans',system-ui,-apple-system,sans-serif;--brand:'Montserrat','Nunito Sans',sans-serif;--serif:'Cormorant Garamond',Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:18.5px;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased}
.top{background:linear-gradient(180deg,rgba(11,11,11,.70) 0%,rgba(11,11,11,.86) 100%),url('/home/house-bg.jpg') center 60%/cover no-repeat var(--black);color:#fff;padding:34px 16px 30px;text-align:center;border-bottom:3px solid var(--gold)}
.top img{width:120px;height:120px;display:block;margin:0 auto;border-radius:18px;box-shadow:0 10px 24px -10px rgba(0,0,0,.7)}
.top h1{font-family:var(--serif);font-weight:700;font-size:46px;letter-spacing:-.005em;line-height:1.05;margin-top:6px;background:linear-gradient(180deg,#e3b55a 0%,#c9952f 48%,#8f6418 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.top p{font-size:18.5px;color:#d9d2c0;max-width:560px;margin:8px auto 0}
main{max-width:980px;margin:0 auto;padding:28px 16px 36px}
h2{font-family:var(--brand);font-weight:700;font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-ink);margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.co{background:var(--card);border:1px solid var(--bdr);border-top:5px solid var(--gold);border-radius:14px;padding:22px 22px 24px;display:flex;flex-direction:column;box-shadow:0 2px 4px rgba(22,20,15,.04),0 10px 28px rgba(22,20,15,.08)}
.co h3{font-family:var(--serif);font-size:32px;font-weight:700;line-height:1.1}
.co .head{display:flex;align-items:center;gap:14px;margin-bottom:2px}
.co .logo{width:64px;height:64px;border-radius:12px;object-fit:cover;flex:none;background:#111318}
.later{margin-top:34px}
.later .grid{grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.co.soon{border-top-color:var(--bdr);box-shadow:none;padding:18px 18px 20px}
.co.soon h3{font-size:21px}
.co.soon .what{margin-bottom:6px}
.soon-tag{display:inline-block;font-size:14.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--gold-ink);background:var(--soft);border:1px solid var(--bdr);border-radius:999px;padding:2px 10px;margin-bottom:10px;align-self:flex-start}
.co.soon .go{background:transparent;color:var(--ink);border:2px solid var(--ink);padding:12px;font-size:17.5px}
.co.soon .go:hover,.co.soon .go:focus-visible{background:var(--soft)}
.co .what{font-size:17.5px;font-weight:700;color:var(--ink3);margin:4px 0 12px}
/* An open company: just who they are and the way in, dark and gold like the brand. */
.co.open{width:100%;max-width:620px;justify-self:center;background:radial-gradient(120% 90% at 50% 0%,#23201a 0%,#0e0d0b 70%);border:1px solid #3a3326;border-top:1px solid #3a3326;color:#f3ede0;text-align:center;align-items:center;padding:38px 28px 30px;box-shadow:0 18px 40px -18px rgba(22,20,15,.55)}
.co.open .mark{width:112px;height:112px;border-radius:50%;object-fit:cover;background:#111318;border:2px solid var(--gold);box-shadow:0 0 0 6px rgba(168,146,95,.12)}
.co.open h3{font-size:40px;margin-top:18px;background:linear-gradient(180deg,#ecc677 0%,#c9952f 55%,#9a6d1c 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.co.open .tag{font-family:var(--brand);font-weight:600;font-size:14.5px;letter-spacing:.2em;text-transform:uppercase;color:#cbb88a;margin-top:8px}
.co.open .rule{width:56px;height:1px;background:var(--gold);opacity:.7;margin:22px auto}
.co.open .go{width:100%;max-width:320px;background:linear-gradient(180deg,#d6ad5c,#b08a3e);color:#16140f;border-radius:999px;padding:15px 22px}
.co.open .go:hover,.co.open .go:focus-visible{background:linear-gradient(180deg,#e2bc6c,#bd9648)}
.co.open .site{margin-top:14px;font-size:16px;color:#a89c84;text-decoration:none}
.co.open .site:hover,.co.open .site:focus-visible{color:#e3d6b8;text-decoration:underline}
.co .about{color:var(--ink2);margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chips span{background:var(--soft);border:1px solid var(--bdr);border-radius:999px;padding:4px 12px;font-size:16px;color:var(--ink2)}
.contact{font-size:17px;color:var(--ink2);margin-bottom:18px;flex:1}
.contact a{color:var(--gold-ink);font-weight:800}
.go{display:block;text-align:center;text-decoration:none;color:#fff;background:var(--go);border-radius:10px;padding:16px;font-size:19px;font-weight:800}
.go:hover,.go:focus-visible{background:var(--go2)}
a:focus-visible{outline:3px solid #f0b429;outline-offset:2px}
.hq{margin-top:20px;background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.hq b{font-size:19px}
.hq .sm{font-size:16.5px;color:var(--ink3)}
.hq a{color:var(--ink);font-weight:800;text-decoration:none;border:2px solid var(--ink);border-radius:10px;padding:11px 16px;font-size:17.5px}
.empty{background:var(--card);border:1px dashed var(--bdr);border-radius:14px;padding:22px;color:var(--ink3);text-align:center}
.foot{text-align:center;color:var(--ink3);font-size:16.5px;margin-top:28px;line-height:1.9}
.foot a{color:var(--gold-ink);font-weight:800}
@media (max-width:600px){.co.open{padding:32px 20px 26px}.co.open h3{font-size:34px}.co.open .mark{width:96px;height:96px}.top{padding:24px 16px 24px}.top img{width:96px;height:96px}.top h1{font-size:38px}.co{padding:20px 18px}.co h3{font-size:24px}.grid{grid-template-columns:1fr}.hq a{width:100%;text-align:center}}
</style>
</head>
<body>
<header class="top">
  <img src="/lcg-mark.svg" alt="">
  <h1>Levi Construction Group</h1>
  <p>Our companies. Pick one to open its projects and files.</p>
</header>
<main>
  <h2>Our companies</h2>
  <div class="grid" id="cos"><div class="empty">Loading…</div></div>
  <section class="later" id="later" hidden aria-labelledby="later-h"><h2 id="later-h">Upcoming</h2><div class="grid" id="soon"></div></section>
  <div class="hq">
    <div><b>Everything, all companies</b><div class="sm">The whole group’s CRM: every project, the team and the settings.</div></div>
    <a href="/crm/app">Open the group CRM</a>
  </div>
  <div class="foot">Homeowner or sub? <a href="/crm/login">Sign in here</a><br><a href="/">← Eagle I home</a></div>
</main>
<script>
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const site = (u) => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return ''; } };
fetch('/api/crm-portfolio').then(r => r.json()).then(d => {
  const el = document.getElementById('cos');
  const all = (d && d.companies) || [];
  // Open now under Our companies; the ones still to come below, under Upcoming.
  const cos = all.filter(c => !c.upcoming), soon = all.filter(c => c.upcoming);
  if (soon.length) {
    document.getElementById('later').hidden = false;
    document.getElementById('soon').innerHTML = soon.map(c => `<section class="co soon" aria-labelledby="c-${esc(c.slug)}">
      <span class="soon-tag">Coming soon</span>
      <div class="head">${c.logo ? `<img class="logo" src="${esc(c.logo)}" alt="">` : ''}<h3 id="c-${esc(c.slug)}">${esc(c.name)}</h3></div>
      ${c.what ? `<div class="what">${esc(c.what)}</div>` : ''}
      <div class="contact"></div>
      <a class="go" href="/crm/c/${encodeURIComponent(c.slug)}">Open ${esc(c.name)}</a>
    </section>`).join('');
  }
  if (!cos.length) { el.innerHTML = '<div class="empty">' + (soon.length ? 'Our companies show here once they’re open.' : 'No companies are set up yet. Open the group CRM and add them under Company → Our companies.') + '</div>'; return; }
  el.innerHTML = cos.map(c => `<section class="co open" aria-labelledby="c-${esc(c.slug)}">
      ${c.logo ? `<img class="mark" src="${esc(c.logo)}" alt="${esc(c.name)} logo">` : ''}
      <h3 id="c-${esc(c.slug)}">${esc(c.name)}</h3>
      ${c.what ? `<div class="tag">${esc(c.what)}</div>` : ''}
      <div class="rule"></div>
      <a class="go" href="/crm/c/${encodeURIComponent(c.slug)}">Open ${esc(c.name)}</a>
      ${c.website && site(c.website) ? `<a class="site" href="${esc(c.website)}" target="_blank" rel="noopener">${esc(site(c.website))}</a>` : ''}
    </section>`).join('');
}).catch(() => { document.getElementById('cos').innerHTML = '<div class="empty">Couldn’t load the companies. Check your connection and refresh.</div>'; });
</script>
</body>
</html>
