<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Eagle I — Choose a Page</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Exo+2:wght@400;500&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#04070e;--bg3:#0a1626;--bg4:#0f1f35;--bg5:#152845;--bdr2:rgba(30,140,255,.20);
--ink:#e0eaf8;--ink2:#6e96c0;--ink3:#2e5070;--blue:#1a7ee8;--blue2:#3aa0ff;--green:#00d97a;--red:#ff2d4a;
--fh:'Rajdhani',sans-serif;--fb:'Exo 2',sans-serif;--fm:'Share Tech Mono',monospace;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:480px;background:var(--bg3);border:1px solid var(--bdr2);border-radius:14px;padding:32px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
h1{font-family:var(--fh);font-size:22px;letter-spacing:1px;margin-bottom:6px}
.sub{font-family:var(--fm);font-size:10px;color:var(--blue2);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:20px}
.page-row{background:var(--bg5);border:1px solid var(--bdr2);border-radius:8px;padding:12px 14px;margin-bottom:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:border-color .15s}
.page-row:hover{border-color:var(--blue2)}
.page-name{font-size:14px;color:var(--ink)}
.page-go{font-family:var(--fm);font-size:9px;color:var(--blue2);text-transform:uppercase;letter-spacing:1px}
.err{color:var(--red);font-size:12px;margin-top:12px;text-align:center;display:none}
.status{font-family:var(--fm);font-size:11px;color:var(--ink2);margin-top:14px;text-align:center}
</style>
</head>
<body>
<div class="card">
  <h1>Choose a Page to connect</h1>
  <div class="sub">Your Facebook account manages more than one Page</div>
  <div id="pages"><div class="status">Loading your Pages...</div></div>
  <div class="err" id="err"></div>
</div>

<script>
async function load(){
  const wrap=document.getElementById('pages');
  const err=document.getElementById('err');
  try{
    const r=await fetch('/api/social/meta/pending-pages');
    const d=await r.json();
    if(!d.pages || !d.pages.length){
      wrap.innerHTML='';
      err.textContent='No pending connection found — start again from the dashboard\'s Social HQ tab.';
      err.style.display='block';
      return;
    }
    wrap.innerHTML=d.pages.map(p=>`<div class="page-row" onclick="choose('${p.id}')"><span class="page-name">${p.name}</span><span class="page-go">Connect →</span></div>`).join('');
  }catch(e){
    wrap.innerHTML='';
    err.textContent='Network error: '+e.message;
    err.style.display='block';
  }
}

async function choose(pageId){
  const err=document.getElementById('err');
  err.style.display='none';
  try{
    const r=await fetch('/api/social/meta/select-page',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pageId})});
    const d=await r.json();
    if(!r.ok){
      err.textContent=d.error?.message||'Connection failed';
      err.style.display='block';
      return;
    }
    window.location.href='/?social_connected=facebook';
  }catch(e){
    err.textContent='Network error: '+e.message;
    err.style.display='block';
  }
}

load();
</script>
</body>
</html>
