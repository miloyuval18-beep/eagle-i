<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Eagle I — Verify Email</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Contrast pass — same verified palette as the main dashboard (see
     index.html's :root comment): ink/ink2/ink3 all clear WCAG AA
     everywhere they're used and AAA in most places; bdr2 now clears the
     3:1 non-text minimum for visible card/input borders. */
  --bg:#faf9f6;--bg-card:#ffffff;--bg-soft:#f1efea;
  --ink:#201e1a;--ink2:#423d37;--ink3:#524d45;
  --bdr:#bdb6a8;--bdr2:#8f8879;--bdr-strong:#201e1a;
  --f:'Nunito Sans',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;-webkit-font-smoothing:antialiased}
.card{width:100%;max-width:420px;background:var(--bg-card);border:1px solid var(--bdr);border-radius:14px;padding:32px;box-shadow:0 2px 4px rgba(32,30,26,.04),0 8px 24px rgba(32,30,26,.07);text-align:center}
h1{font-size:24px;font-weight:800;letter-spacing:.2px;margin-bottom:6px}
.sub{font-size:15px;color:var(--ink3);margin-bottom:24px}
button.primary{width:100%;margin-top:10px;background:var(--ink);color:#fff;border:none;border-radius:8px;padding:14px;font-family:var(--f);font-size:16px;font-weight:700;cursor:pointer}
button.primary:hover{background:#000}
button.primary:disabled{opacity:.5;cursor:not-allowed}
.err{color:var(--ink);background:var(--bg-soft);border:1px solid var(--bdr2);border-radius:8px;padding:10px 12px;font-size:14px;font-weight:600;margin-top:14px}
.err::before{content:'⚠ '}
.status{font-size:15px;font-weight:600;color:var(--ink);background:var(--bg-soft);border:1px solid var(--bdr2);border-radius:8px;padding:12px;margin-top:14px}
.status::before{content:'✓ '}
a{color:var(--ink2);font-size:15px;text-decoration:underline;display:block;text-align:center;margin-top:18px}
a:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
</style>
</head>
<body>
<div class="card">
  <h1>Verify your email</h1>
  <div class="sub" id="sub">Click the button below to confirm this email address really belongs to you.</div>
  <button class="primary" id="confirmBtn" onclick="confirmEmail()">Confirm This Is Me</button>
  <div class="status" id="status" style="display:none"></div>
  <div class="err" id="err" style="display:none"></div>
  <a href="/">Go to My Dashboard</a>
</div>
<script>
const token=new URLSearchParams(window.location.search).get('token');
if(!token){
  document.getElementById('confirmBtn').style.display='none';
  const err=document.getElementById('err');
  err.textContent="This verification link is missing or no longer works. Check your email for the most recent verification message, or go to Account Settings to send a new one.";
  err.style.display='block';
}
async function confirmEmail(){
  const btn=document.getElementById('confirmBtn');
  const status=document.getElementById('status');
  const err=document.getElementById('err');
  btn.disabled=true;
  err.style.display='none';
  try{
    const r=await fetch('/api/auth/verify-email',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});
    const d=await r.json();
    if(!r.ok){
      err.textContent=d.error?.message||'Verification failed';
      err.style.display='block';
      btn.disabled=false;
      return;
    }
    status.textContent="Thanks — your email is now verified!";
    status.style.display='block';
    btn.style.display='none';
  }catch(e){
    err.textContent='Network error: '+e.message;
    err.style.display='block';
    btn.disabled=false;
  }
}
</script>
</body>
</html>
