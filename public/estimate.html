<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Your Estimate</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<!-- The homeowner's view of an estimate from Eagle I CRM (routes/crmEstimates.js).
     Shows prices only; costs and markups never leave the server. -->
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#14202b;--ink2:#3a4855;--ink3:#55636f;--bdr:#c3ccd4;--bdr2:#8794a0;--accent:#1f4e79;--accent2:#173b5c;--ok:#2c6e49;--err:#a12a1f;--f:'Nunito Sans',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:22px 20px;margin-bottom:14px}
.co{font-size:20px;font-weight:800}
.co-sub{font-size:13px;color:var(--ink3);margin-top:2px;overflow-wrap:anywhere}
.head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.kind{font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--accent)}
h1{font-size:22px;line-height:1.25;margin:4px 0 6px;overflow-wrap:anywhere}
.meta{font-size:14px;color:var(--ink2)}
.pill{display:inline-block;font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px;border:1px solid var(--bdr2);color:var(--ink2)}
.pill.ok{color:var(--ok);border-color:var(--ok);background:rgba(44,110,73,.08)}
.pill.bad{color:var(--err);border-color:var(--err)}
.intro{white-space:pre-wrap;margin-top:12px;color:var(--ink2)}
.sec{margin-top:18px}
.sec-h{display:flex;justify-content:space-between;gap:10px;font-weight:800;border-bottom:2px solid var(--ink);padding-bottom:4px;margin-bottom:6px}
.line{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #e3e7eb;font-size:15px}
.line .d{flex:1;min-width:0;overflow-wrap:anywhere}
.line .q{font-size:13px;color:var(--ink3)}
.line .p{white-space:nowrap;font-weight:700}
.tot{margin-top:16px;margin-left:auto;max-width:340px}
.tot div{display:flex;justify-content:space-between;padding:4px 0}
.tot .grand{font-size:20px;font-weight:800;border-top:2px solid var(--ink);padding-top:8px;margin-top:4px}
.terms{white-space:pre-wrap;font-size:14px;color:var(--ink2)}
h2{font-size:17px;margin-bottom:8px}
label{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin:12px 0 5px}
input[type=text],textarea{width:100%;border:1.5px solid var(--bdr2);border-radius:8px;padding:11px 12px;font-family:var(--f);font-size:16px;color:var(--ink)}
input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,78,121,.12)}
.check{display:flex;gap:9px;align-items:flex-start;margin-top:12px;font-size:14px}
.check input{width:20px;height:20px;flex:0 0 auto;margin-top:1px}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:6px;border:0;border-radius:8px;padding:13px 18px;font-family:var(--f);font-size:16px;font-weight:800;cursor:pointer}
.btn-p{background:var(--accent);color:#fff;width:100%;margin-top:14px}
.btn-p:hover{background:var(--accent2)}
.btn-p:disabled{opacity:.5}
.btn-l{background:none;color:var(--ink2);text-decoration:underline;padding:8px 0;font-weight:600;font-size:15px}
.btn-o{background:#fff;border:1.5px solid var(--bdr2);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.err{color:var(--err);font-size:14px;margin-top:8px;min-height:18px}
.banner{border-radius:10px;padding:12px 14px;font-size:15px;margin-bottom:14px}
.banner.ok{background:rgba(44,110,73,.1);border:1px solid var(--ok)}
.banner.warn{background:#fff6e0;border:1px solid #c79a2b}
.prop{margin-top:16px}
.prop .letter{white-space:pre-wrap;font-size:16px;line-height:1.6;padding:14px 16px;border-left:3px solid var(--accent);background:#f3f7fb;border-radius:0 10px 10px 0}
.prop h2{margin:18px 0 6px}
.prop .scope{margin-top:8px}.prop .scope b{display:block;font-size:15px}.prop .scope div{color:var(--ink2);font-size:15px}
.prop .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.prop ul{margin:4px 0 0 18px;font-size:15px;color:var(--ink2)}.prop li{margin:2px 0}
@media(max-width:560px){.prop .two{grid-template-columns:1fr}}
.foot{font-size:12px;color:var(--ink3);text-align:center;margin:18px 0 30px}
[hidden]{display:none!important}
.lang{display:block;margin:0 0 6px auto;background:none;border:0;color:var(--accent);font-family:var(--f);font-size:14px;font-weight:700;cursor:pointer;padding:6px 8px}
@media print{body{background:#fff}.no-print{display:none!important}.card{border:0;padding:0}}
</style>
<link rel="stylesheet" href="/eaglei-theme.css">
</head>
<body>
<div class="wrap">
  <button type="button" class="lang no-print" id="lang-btn" onclick="toggleLang()">Español</button>
  <div id="msg"></div>
  <div id="doc"><div class="card">Loading your estimate…</div></div>
  <div class="card no-print" id="act" hidden></div>
  <div class="foot no-print">Sent with Eagle I CRM</div>
</div>
<script>
(()=>{const f=window.fetch.bind(window);window.fetch=(u,o={})=>{try{if(String(u).startsWith('/api/crm-public')&&typeof L!=='undefined'&&L==='es')o={...o,headers:{...(o.headers||{}),'X-Lang':'es'}};}catch(e){}return f(u,o);};})();

const token=location.pathname.split('/').pop();
let E=null,PREVIEW=false;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const T={en:{theWork:'The work',included:'What’s included',notIncluded:'Not included',timeline:'Timeline',nextSteps:'Next steps',whyUs:'Why us',price:'Price',estimate:'Estimate',design_agreement:'Design agreement',from:'{k} from {co}',accepted:'Accepted',declined:'Declined',expired:'Expired',draftPreview:'Draft preview',updating:'Being updated',preparedFor:'Prepared for {n}',validUntil:'Valid until {d}',other:'Other',subtotal:'Subtotal',tax:'Tax ({p}%)',total:'Total',dueAtSigning:'Due at signing ({p}%)',terms:'Terms',acceptedBy:'Accepted by {n} on {d}',
  download:'⬇ Download PDF',print:'Print',previewNote:'This is how your customer sees it. Opening it yourself doesn’t count as a view.',ready:'Ready to go ahead?',typeName:'Type your full name to accept',iAccept:'I accept this {k} for {t}{terms}.',andTerms:' and its terms',acceptBtn:'Accept {k}',notGoing:'Not going ahead? Let us know',anything:'Anything we should know? (optional)',decline:'Decline',
  nextDeposit:'Next: the deposit',depositAsk:'To get started, {co} asks for {a} now.',payDeposit:'Pay the deposit',beingUpdated:'This estimate is being updated. You’ll get an email when the new version is ready.',expiredMsg:'This estimate has expired. Please contact {co}{ph} for an updated one.',at:' at {p}',
  tick:'Tick the box to confirm.',thanks:'<b>Thank you!</b> {co} has been notified and will be in touch about next steps.',thanksDecline:'Thanks for letting us know. We’ve passed it on.',loading:'Loading your estimate…',oops:'Something went wrong. Please try again.'},
es:{theWork:'El trabajo',included:'Qué incluye',notIncluded:'No incluye',timeline:'Tiempo',nextSteps:'Siguientes pasos',whyUs:'Por qué nosotros',price:'Precio',estimate:'Presupuesto',design_agreement:'Acuerdo de diseño',from:'{k} de {co}',accepted:'Aceptado',declined:'Rechazado',expired:'Vencido',draftPreview:'Vista previa del borrador',updating:'En revisión',preparedFor:'Preparado para {n}',validUntil:'Válido hasta el {d}',other:'Otros',subtotal:'Subtotal',tax:'Impuesto ({p}%)',total:'Total',dueAtSigning:'A pagar al firmar ({p}%)',terms:'Términos',acceptedBy:'Aceptado por {n} el {d}',
  download:'⬇ Descargar PDF',print:'Imprimir',previewNote:'Así lo ve su cliente. Abrirlo usted mismo no cuenta como una vista.',ready:'¿Listo para seguir adelante?',typeName:'Escriba su nombre completo para aceptar',iAccept:'Acepto este {k} por {t}{terms}.',andTerms:' y sus términos',acceptBtn:'Aceptar {k}',notGoing:'¿No va a seguir adelante? Avísenos',anything:'¿Algo que debamos saber? (opcional)',decline:'Rechazar',
  nextDeposit:'Siguiente paso: el depósito',depositAsk:'Para empezar, {co} solicita {a} ahora.',payDeposit:'Pagar el depósito',beingUpdated:'Este presupuesto se está actualizando. Recibirá un correo cuando la nueva versión esté lista.',expiredMsg:'Este presupuesto venció. Por favor comuníquese con {co}{ph} para obtener uno actualizado.',at:' al {p}',
  tick:'Marque la casilla para confirmar.',thanks:'<b>¡Gracias!</b> Le avisamos a {co} y se comunicarán con usted para los siguientes pasos.',thanksDecline:'Gracias por avisarnos. Ya se lo hicimos saber al equipo.',loading:'Cargando su presupuesto…',oops:'Algo salió mal. Por favor intente de nuevo.'}};
let L=(()=>{const q=new URLSearchParams(location.search).get('lang');if(q)return q==='es'?'es':'en';try{const s=localStorage.getItem('eaglei_lang');if(s)return s;}catch(e){}return /^es/i.test(navigator.language||'')?'es':'en';})();
let chosenLang=!!new URLSearchParams(location.search).get('lang');try{if(localStorage.getItem('eaglei_lang'))chosenLang=true;}catch(e){}
const t=(k,v)=>String((T[L]||T.en)[k]??T.en[k]??k).replace(/\{(\w+)\}/g,(m,x)=>(v||{})[x]??'');
const loc=()=>L==='es'?'es-US':'en-US';
const kindOf=e=>t(e.kind==='design_agreement'?'design_agreement':'estimate');
function setLangBtn(){document.documentElement.lang=L;document.getElementById('lang-btn').textContent=L==='es'?'English':'Español';}
function toggleLang(){L=L==='es'?'en':'es';chosenLang=true;try{localStorage.setItem('eaglei_lang',L);}catch(e){}setLangBtn();if(E)render();}
setLangBtn();document.querySelector('#doc .card').textContent=t('loading');
const fmtDate=d=>d?new Date(String(d).slice(0,10)+'T12:00:00Z').toLocaleDateString(loc(),{month:'long',day:'numeric',year:'numeric'}):'';
async function api(url,body){
  const r=await fetch(url,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});
  let d={};try{d=await r.json();}catch(e){}
  if(!r.ok)throw new Error((d.error&&d.error.message)||t('oops'));
  return d;
}
function render(){
  const e=E,c=e.company||{};
  const K=kindOf(e),k=K.toLowerCase();
  document.title=t('from',{k:K,co:c.name||''});
  const status=e.status==='accepted'?`<span class="pill ok">${t('accepted')}</span>`:e.status==='declined'?`<span class="pill bad">${t('declined')}</span>`:e.expired?`<span class="pill bad">${t('expired')}</span>`:e.status==='draft'?(PREVIEW?`<span class="pill">${t('draftPreview')}</span>`:`<span class="pill">${t('updating')}</span>`):'';
  document.getElementById('doc').innerHTML=`<div class="card">
    <div class="head"><div><div class="co">${esc(c.name)}</div><div class="co-sub">${esc([c.address,c.phone,c.email].filter(Boolean).join(' · '))}</div></div>${status}</div>
    <div style="margin-top:18px"><div class="kind">${esc(K)} #${esc(e.number)}</div><h1>${esc(e.title)}</h1>
    <div class="meta">${esc(t('preparedFor',{n:e.customer.name}))}${e.customer.address?' · '+esc(e.customer.address):''}${e.validUntil?'<br>'+esc(t('validUntil',{d:fmtDate(e.validUntil)})):''}</div></div>
    ${e.intro?`<div class="intro">${esc(e.intro)}</div>`:''}
    ${propHtml(e.proposal)}
    ${e.proposal?`<h2 style="margin-top:22px">${t('price')}</h2>`:''}
    ${e.sections.map(s=>`<div class="sec">${s.name||e.sections.length>1?`<div class="sec-h"><span>${esc(s.name||t('other'))}</span>${e.showLinePrices?'':`<span>${money(s.total)}</span>`}</div>`:''}
      ${s.lines.map(l=>`<div class="line"><div class="d">${esc(l.description)}${Number(l.quantity)!==1||l.unit!=='ea'?`<div class="q">${Number(l.quantity).toLocaleString(loc())} ${esc(l.unit)}</div>`:''}</div>${l.price!=null?`<div class="p">${money(l.price)}</div>`:''}</div>`).join('')}</div>`).join('')}
    <div class="tot">
      ${e.tax?`<div><span>${t('subtotal')}</span><span>${money(e.subtotal)}</span></div><div><span>${t('tax',{p:e.taxPct})}</span><span>${money(e.tax)}</span></div>`:''}
      <div class="grand"><span>${t('total')}</span><span>${money(e.total)}</span></div>
      ${e.depositPct?`<div><span>${t('dueAtSigning',{p:e.depositPct})}</span><span>${money(e.deposit)}</span></div>`:''}
    </div>
    ${e.terms?`<div class="sec"><h2>${t('terms')}</h2><div class="terms">${esc(e.terms)}</div></div>`:''}
    ${e.status==='accepted'?`<div class="sec meta">${esc(t('acceptedBy',{n:e.acceptedName,d:new Date(e.acceptedAt).toLocaleString(loc())}))}</div>`:''}
  </div>`;
  const act=document.getElementById('act');act.hidden=false;
  const dl=`<div class="row"><button class="btn btn-o" onclick="pdf()">${t('download')}</button><button class="btn btn-l" onclick="print()">${t('print')}</button></div>`;
  if(PREVIEW){act.innerHTML='<p class="meta">'+esc(t('previewNote'))+'</p><div style="margin-top:10px">'+dl+'</div>';return;}
  if(e.status==='sent'&&!e.expired){
    act.innerHTML=`<h2>${t('ready')}</h2>
      <label for="nm">${t('typeName')}</label><input type="text" id="nm" autocomplete="name" value="${esc(e.customer.name||'')}">
      <div class="check"><input type="checkbox" id="ag"><label for="ag" style="margin:0;font-weight:400;font-size:14px">${esc(t('iAccept',{k,t:money(e.total),terms:e.terms?t('andTerms'):''}))}</label></div>
      <button class="btn btn-p" id="acc" onclick="accept()">${esc(t('acceptBtn',{k}))}</button><div class="err" id="err" role="alert"></div>
      <div style="margin-top:12px">${dl}</div>
      <div style="margin-top:6px"><button class="btn btn-l" onclick="showDecline()">${t('notGoing')}</button></div>
      <div id="dec" hidden><label for="why">${t('anything')}</label><textarea id="why" rows="3"></textarea><button class="btn btn-o" style="margin-top:10px" onclick="decline()">${t('decline')}</button></div>`;
  }else{
    if(e.status==='accepted'&&e.depositInvoice&&!e.depositInvoice.paid){
      act.innerHTML=`<h2>${t('nextDeposit')}</h2><p class="meta">${esc(t('depositAsk',{co:c.name,a:money(e.depositInvoice.amount)}))}</p><a class="btn btn-p" style="text-decoration:none" href="${esc(e.depositInvoice.link)}${L==='es'?'?lang=es':''}">${t('payDeposit')}</a><div style="margin-top:12px">${dl}</div>`;
      return;
    }
    act.innerHTML=(e.status==='draft'?`<p class="meta">${esc(t('beingUpdated'))}</p>`:e.expired?`<p class="meta">${esc(t('expiredMsg',{co:c.name,ph:c.phone?t('at',{p:c.phone}):''}))}</p>`:'')+'<div style="margin-top:8px">'+dl+'</div>';
  }
}
function propHtml(p){
  if(!p)return '';
  const ul=a=>a&&a.length?'<ul>'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'';
  return `<div class="prop">${p.letter?`<div class="letter">${esc(p.letter)}</div>`:''}
    ${p.scope&&p.scope.length?`<h2>${t('theWork')}</h2>${p.scope.map(s=>`<div class="scope"><b>${esc(s.section)}</b><div>${esc(s.text)}</div></div>`).join('')}`:''}
    ${(p.included&&p.included.length)||(p.excluded&&p.excluded.length)?`<div class="two">${p.included&&p.included.length?`<div><h2>${t('included')}</h2>${ul(p.included)}</div>`:''}${p.excluded&&p.excluded.length?`<div><h2>${t('notIncluded')}</h2>${ul(p.excluded)}</div>`:''}</div>`:''}
    ${p.timeline?`<h2>${t('timeline')}</h2><div class="meta">${esc(p.timeline)}</div>`:''}
    ${p.whyUs?`<h2>${t('whyUs')}</h2><div class="meta">${esc(p.whyUs)}</div>`:''}
    ${p.nextSteps&&p.nextSteps.length?`<h2>${t('nextSteps')}</h2><ol style="margin:4px 0 0 18px;font-size:15px;color:var(--ink2)">${p.nextSteps.map(x=>'<li>'+esc(x)+'</li>').join('')}</ol>`:''}</div>`;
}
function banner(html,kind){document.getElementById('msg').innerHTML=`<div class="banner ${kind}">${html}</div>`;window.scrollTo(0,0);}
function showDecline(){document.getElementById('dec').hidden=false;}
async function accept(){
  const err=document.getElementById('err'),b=document.getElementById('acc');err.textContent='';
  if(!document.getElementById('ag').checked){err.textContent=t('tick');return;}
  b.disabled=true;
  try{const d=await api(`/api/crm-public/estimates/${token}/accept`,{name:document.getElementById('nm').value});E=d.estimate;render();banner(t('thanks',{co:esc(E.company.name)}),'ok');}
  catch(x){err.textContent=x.message;b.disabled=false;}
}
async function decline(){
  try{const d=await api(`/api/crm-public/estimates/${token}/decline`,{reason:document.getElementById('why').value});E=d.estimate;render();banner(esc(t('thanksDecline')),'warn');}
  catch(x){alert(x.message);}
}
function pdf(){
  if(!window.jspdf){print();return;}
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'pt',format:'letter'});
  const e=E,c=e.company||{};const W=612,M=48;let y=M;
  const line=(t,o={})=>{doc.setFont('helvetica',o.bold?'bold':'normal');doc.setFontSize(o.size||10);const parts=doc.splitTextToSize(String(t||''),o.w||W-2*M);for(const p of parts){if(y>740){doc.addPage();y=M;}doc.text(p,o.x||M,y,o.right?{align:'right'}:undefined);y+=(o.size||10)*1.35;}};
  line(c.name,{bold:true,size:16});line([c.address,c.phone,c.email].filter(Boolean).join(' · '),{size:9});y+=10;
  line(`${kindOf(e)} #${e.number}`,{bold:true,size:9});line(e.title,{bold:true,size:14});
  line(`${t('preparedFor',{n:e.customer.name})}${e.customer.address?' · '+e.customer.address:''}`,{size:10});
  if(e.validUntil)line(t('validUntil',{d:fmtDate(e.validUntil)}),{size:10});
  if(e.intro){y+=6;line(e.intro);}
  const P=e.proposal;
  if(P){
    const head=h=>{y+=10;line(h,{bold:true,size:12});};
    if(P.letter){y+=8;line(P.letter,{size:10.5});}
    if(P.scope&&P.scope.length){head(t('theWork'));for(const s of P.scope){line(s.section,{bold:true});line(s.text);y+=3;}}
    if(P.included&&P.included.length){head(t('included'));P.included.forEach(x=>line('•  '+x));}
    if(P.excluded&&P.excluded.length){head(t('notIncluded'));P.excluded.forEach(x=>line('•  '+x));}
    if(P.timeline){head(t('timeline'));line(P.timeline);}
    if(P.whyUs){head(t('whyUs'));line(P.whyUs);}
    if(P.nextSteps&&P.nextSteps.length){head(t('nextSteps'));P.nextSteps.forEach((x,i)=>line((i+1)+'.  '+x));}
    y+=6;head(t('price'));
  }
  y+=8;
  for(const s of e.sections){
    if(s.name||e.sections.length>1){y+=6;if(y>730){doc.addPage();y=M;}doc.setFont('helvetica','bold');doc.setFontSize(11);doc.text(s.name||t('other'),M,y);if(!e.showLinePrices)doc.text(money(s.total),W-M,y,{align:'right'});y+=4;doc.line(M,y,W-M,y);y+=14;}
    for(const l of s.lines){
      const d=l.description+(Number(l.quantity)!==1||l.unit!=='ea'?`  (${Number(l.quantity).toLocaleString('en-US')} ${l.unit})`:'');
      const parts=doc.splitTextToSize(d,W-2*M-90);if(y+parts.length*13>740){doc.addPage();y=M;}
      doc.setFont('helvetica','normal');doc.setFontSize(10);parts.forEach((p,i)=>doc.text(p,M,y+i*13));
      if(l.price!=null)doc.text(money(l.price),W-M,y,{align:'right'});y+=parts.length*13+4;
    }
  }
  y+=10;if(y>700){doc.addPage();y=M;}
  const tr=(k,v,b)=>{doc.setFont('helvetica',b?'bold':'normal');doc.setFontSize(b?13:10);doc.text(k,W-M-200,y);doc.text(v,W-M,y,{align:'right'});y+=b?18:14;};
  if(e.tax){tr(t('subtotal'),money(e.subtotal));tr(t('tax',{p:e.taxPct}),money(e.tax));}
  tr(t('total'),money(e.total),true);if(e.depositPct)tr(t('dueAtSigning',{p:e.depositPct}),money(e.deposit));
  if(e.terms){y+=10;line(t('terms'),{bold:true,size:11});line(e.terms,{size:9});}
  if(e.status==='accepted'){y+=8;line(t('acceptedBy',{n:e.acceptedName,d:new Date(e.acceptedAt).toLocaleString(loc())}),{size:9});}
  doc.save(`${(c.name||'Estimate').replace(/[^a-z0-9]+/gi,'-')}-${e.number}.pdf`);
}
(async()=>{
  try{const d=await api('/api/crm-public/estimates/'+token);E=d.estimate;PREVIEW=!!d.preview;if(E.lang==='es'&&!chosenLang){L='es';setLangBtn();}render();}
  catch(x){document.getElementById('doc').innerHTML='<div class="card">'+esc(x.message)+'</div>';}
})();
</script>
</body>
</html>
