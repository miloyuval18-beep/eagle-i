<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Your Project</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<!-- The homeowner's project portal from Eagle I CRM (routes/crmPortal.js).
     Shows only what the team shared: status, visits, estimates, photos,
     documents and updates. Never costs, notes or internal history. -->
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#14202b;--ink2:#3a4855;--ink3:#55636f;--bdr:#c3ccd4;--bdr2:#8794a0;--accent:#1f4e79;--accent2:#173b5c;--ok:#2c6e49;--err:#a12a1f;--f:'Nunito Sans',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:18px;margin-bottom:14px}
.co{font-size:14px;color:var(--ink3);overflow-wrap:anywhere}
h1{font-size:23px;line-height:1.25;margin:4px 0;overflow-wrap:anywhere}
h2{font-size:17px;margin-bottom:10px}
.pill{display:inline-block;font-size:13px;font-weight:800;border-radius:999px;padding:3px 11px;background:rgba(31,78,121,.1);color:var(--accent);border:1px solid var(--accent)}
.meta{font-size:14px;color:var(--ink2)}
.visit{margin-top:12px;padding:10px 12px;border-radius:10px;background:#eef4fa;font-size:15px}
.up{border-top:1px solid #e3e7eb;padding:12px 0}
.up:first-of-type{border-top:0;padding-top:0}
.up-b{white-space:pre-wrap;overflow-wrap:anywhere}
.up-m{font-size:12px;color:var(--ink3);margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid a{display:block;aspect-ratio:1;border-radius:8px;overflow:hidden;background:#e3e7eb}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-top:1px solid #e3e7eb;font-size:15px}
.row:first-child{border-top:0}
.row a{color:var(--accent);font-weight:700;overflow-wrap:anywhere}
.tag{font-size:12px;color:var(--ink3);white-space:nowrap}
textarea{width:100%;border:1.5px solid var(--bdr2);border-radius:8px;padding:11px 12px;font-family:var(--f);font-size:16px;color:var(--ink);resize:vertical}
textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,78,121,.12)}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:6px;border:0;border-radius:8px;padding:12px 16px;font-family:var(--f);font-size:16px;font-weight:800;cursor:pointer;background:var(--accent);color:#fff}
.btn:disabled{opacity:.5}
.btn-o{background:#fff;border:1.5px solid var(--bdr2);color:var(--ink)}
.msg{font-size:14px;margin-top:8px;min-height:18px}
.empty{font-size:14px;color:var(--ink3)}
.foot{font-size:12px;color:var(--ink3);text-align:center;margin:16px 0 30px}
.ph{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid #e3e7eb;font-size:15px}
.ph:first-of-type{border-top:0}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--bdr);flex:0 0 auto;margin-top:6px}
.dot.doing{border-color:var(--accent);background:#cfe0ef}.dot.done{border-color:var(--ok);background:var(--ok)}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1.5px solid var(--bdr);border-radius:10px;margin-top:8px;cursor:pointer}
.opt input{margin-top:4px;width:18px;height:18px;flex:0 0 auto}
.opt.chosen{border-color:var(--ok);background:rgba(44,110,73,.06)}
input[type=text].nm{width:100%;border:1.5px solid var(--bdr2);border-radius:8px;padding:11px 12px;font-family:var(--f);font-size:16px;margin-top:8px}
@media(max-width:420px){.grid{grid-template-columns:repeat(2,1fr)}}
.lang{display:block;margin:0 0 -6px auto;background:none;border:0;color:var(--accent);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;padding:6px 8px}
</style>
</head>
<body>
<div class="wrap"><button type="button" class="lang" id="lang-btn" onclick="toggleLang()">Español</button></div>
<div class="wrap" id="app"><div class="card">Loading your project…</div></div>
<div class="foot">Powered by Eagle I CRM</div>
<script>
(()=>{const f=window.fetch.bind(window);window.fetch=(u,o={})=>{try{if(String(u).startsWith('/api/crm-public')&&typeof L!=='undefined'&&L==='es')o={...o,headers:{...(o.headers||{}),'X-Lang':'es'}};}catch(e){}return f(u,o);};})();

const token=location.pathname.split('/').pop();
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fileUrl=id=>`/api/crm-public/portal/${token}/files/${id}`;
const T={en:{loading:'Loading your project…',invalid:'This link is not valid.',nextVisit:'Next visit',updates:'Updates',noUpdates:'Updates from your team will show up here.',photos:'Photos',noPhotos:'No photos yet.',addPhotos:'📷 Add your photos',projectPhoto:'Project photo',documents:'Documents',
  message:'Message {co}',us:'us',msgPh:'Questions, changes, anything on your mind…',yourMsg:'Your message',sendMsg:'Send message',sent:'Sent. Your team will get back to you soon.',cantSend:'Could not send. Please try again.',
  homeFile:'Your home file',homeIntro:'What went into your home, with warranties and care. Keep this link; it’s yours.',installed:'installed {d}',goodThrough:'good through {d}',warrantyThrough:'warranty through {d}',care:'Care',careEvery:'Care every {n} month{s}',
  refTitle:'Know someone planning a project?',refIntro:'Share your personal link. Anyone who reaches out through it is credited to you, so {co} can say thank you.',we:'we',share:'Share',copied:'Copied',
  waiting:'Waiting for your OK',co:'Change order #{n}: {t}',adds:'Adds {a}',credits:'Credits {a}',moreDays:' · {n} more working day{s}',typeName:'Type your full name to approve',approve:'Approve',decline:'Decline',cantSave:'Could not save. Please try again.',
  ask:'Ask about your project',askIntro:'Quick answers from what’s on file: dates, what’s next, what you’ve approved. Anything else goes straight to the team.',askPh:'e.g. When does the tile go in?',askBtn:'Ask',asking:'Looking…',askFwd:'Your team has the question too.',punch:'Finishing touches',punchIntro:'What’s left before we’re done. We tick each one off as it’s finished.',
  selections:'Your selections',allowance:'Allowance {a}',chooseBy:'· choose by {d}',over:'({a} over)',choose:'Choose',pickFirst:'Pick one of the options first.',savedOver:'Saved. That’s {a} over the allowance; your team will send a change order for the difference.',saved:'Saved. Thank you!',
  schedule:'Schedule',inProgress:'· in progress',shift:'Dates can shift with weather, inspections and deliveries. Your team will keep this up to date.',
  uploading:'Uploading {n} photo{s}…',tooBig:'{f} is over 8 MB.',upFail:'Upload failed.',added:'Added {n} photo{s}. Your team can see {them} now.',
  status:{new:'Getting started',qualified:'Getting started',site_visit:'Site visit',design_agreement:'Design',in_design:'Design',proposal:'Proposal',signed:'Getting ready to build',production:'Under construction',complete:'Complete',lost:'Closed'},
  estKind:{construction:'Estimate',design_agreement:'Design agreement'},estStatus:{accepted:'Accepted',declined:'Declined',draft:'Being updated',sent:'Waiting for you'},
  cat:{finish:'Finish',appliance:'Appliance',system:'System',warranty:'Warranty',other:'Other'}},
es:{loading:'Cargando su proyecto…',invalid:'Este enlace no es válido.',nextVisit:'Próxima visita',updates:'Novedades',noUpdates:'Aquí aparecerán las novedades de su equipo.',photos:'Fotos',noPhotos:'Todavía no hay fotos.',addPhotos:'📷 Agregar sus fotos',projectPhoto:'Foto del proyecto',documents:'Documentos',
  message:'Escriba a {co}',us:'nosotros',msgPh:'Preguntas, cambios, lo que tenga en mente…',yourMsg:'Su mensaje',sendMsg:'Enviar mensaje',sent:'Enviado. Su equipo le responderá pronto.',cantSend:'No se pudo enviar. Por favor intente de nuevo.',
  homeFile:'El expediente de su casa',homeIntro:'Lo que se instaló en su casa, con garantías y mantenimiento. Guarde este enlace; es suyo.',installed:'instalado el {d}',goodThrough:'válida hasta el {d}',warrantyThrough:'garantía hasta el {d}',care:'Mantenimiento',careEvery:'Mantenimiento cada {n} mes{es}',
  refTitle:'¿Conoce a alguien que esté planeando un proyecto?',refIntro:'Comparta su enlace personal. Quien se comunique a través de él quedará registrado como su recomendación, para que {co} pueda darle las gracias.',we:'nosotros',share:'Compartir',copied:'Copiado',
  waiting:'Esperando su aprobación',co:'Orden de cambio #{n}: {t}',adds:'Agrega {a}',credits:'Acredita {a}',moreDays:' · {n} día{s} hábil{es} más',typeName:'Escriba su nombre completo para aprobar',approve:'Aprobar',decline:'Rechazar',cantSave:'No se pudo guardar. Por favor intente de nuevo.',
  ask:'Pregunte sobre su proyecto',askIntro:'Respuestas rápidas de lo que tenemos registrado: fechas, lo que sigue, lo que ya aprobó. Lo demás va directo al equipo.',askPh:'p. ej. ¿Cuándo ponen el azulejo?',askBtn:'Preguntar',asking:'Buscando…',askFwd:'Su equipo también recibió la pregunta.',punch:'Detalles finales',punchIntro:'Lo que falta antes de terminar. Vamos marcando cada punto cuando queda listo.',
  selections:'Sus selecciones',allowance:'Presupuesto asignado {a}',chooseBy:'· escoger antes del {d}',over:'({a} de más)',choose:'Escoger',pickFirst:'Primero escoja una de las opciones.',savedOver:'Guardado. Son {a} por encima del presupuesto asignado; su equipo le enviará una orden de cambio por la diferencia.',saved:'Guardado. ¡Gracias!',
  schedule:'Calendario',inProgress:'· en curso',shift:'Las fechas pueden cambiar por el clima, las inspecciones y las entregas. Su equipo lo mantendrá al día.',
  uploading:'Subiendo {n} foto{s}…',tooBig:'{f} pesa más de 8 MB.',upFail:'No se pudo subir.',added:'Se agregaron {n} foto{s}. Su equipo ya puede verla{s}.',
  status:{new:'Comenzando',qualified:'Comenzando',site_visit:'Visita al sitio',design_agreement:'Diseño',in_design:'Diseño',proposal:'Propuesta',signed:'Preparando la obra',production:'En construcción',complete:'Terminado',lost:'Cerrado'},
  estKind:{construction:'Presupuesto',design_agreement:'Acuerdo de diseño'},estStatus:{accepted:'Aceptado',declined:'Rechazado',draft:'En revisión',sent:'Esperando su respuesta'},
  cat:{finish:'Acabado',appliance:'Electrodoméstico',system:'Sistema',warranty:'Garantía',other:'Otro'}}};
let L=(()=>{const q=new URLSearchParams(location.search).get('lang');if(q)return q==='es'?'es':'en';try{const s=localStorage.getItem('eaglei_lang');if(s)return s;}catch(e){}return /^es/i.test(navigator.language||'')?'es':'en';})();
let chosenLang=!!new URLSearchParams(location.search).get('lang');try{if(localStorage.getItem('eaglei_lang'))chosenLang=true;}catch(e){}
const t=(k,v)=>String((T[L]||T.en)[k]??T.en[k]??k).replace(/\{(\w+)\}/g,(m,x)=>(v||{})[x]??'');
const tm=(group,key,fallback)=>((T[L]||T.en)[group]||{})[key]||fallback||key;
const pl=n=>n===1?'':'s';
const loc=()=>L==='es'?'es-US':'en-US';
function toggleLang(){L=L==='es'?'en':'es';chosenLang=true;try{localStorage.setItem('eaglei_lang',L);}catch(e){}if(P)render();setLangBtn();}
function setLangBtn(){document.documentElement.lang=L;document.getElementById('lang-btn').textContent=L==='es'?'English':'Español';}
setLangBtn();document.querySelector('#app .card').textContent=t('loading');
let P=null;
async function load(){
  try{
    const r=await fetch('/api/crm-public/portal/'+token);const d=await r.json();
    if(!r.ok)throw new Error((d.error&&d.error.message)||t('invalid'));
    P=d.portal;if(P.lang==='es'&&!chosenLang)L='es';setLangBtn();render();
  }catch(e){document.getElementById('app').innerHTML='<div class="card">'+esc(e.message)+'</div>';}
}
function render(){
  const p=P,photos=p.files.filter(f=>f.kind==='photo'),docs=p.files.filter(f=>f.kind==='document');
  document.title=p.project.title+' · '+(p.company.name||'');
  document.getElementById('app').innerHTML=`
  <div class="card">
    <div class="co">${esc(p.company.name)}${p.company.phone?' · '+esc(p.company.phone):''}</div>
    <h1>${esc(p.project.title)}</h1>
    <div class="meta">${esc(p.project.customer)}${p.project.address?' · '+esc(p.project.address):''}</div>
    <div style="margin-top:10px"><span class="pill">${esc(tm('status',p.project.stageKey,p.project.status))}</span></div>
    ${p.nextVisit?`<div class="visit">📅 ${esc(t('nextVisit'))}: <b>${new Date(p.nextVisit).toLocaleString(loc(), {weekday:'long',month:'long',day:'numeric',hour:'numeric',minute:'2-digit'})}</b></div>`:''}
  </div>
  <div class="card"><h2>💬 ${esc(t('ask'))}</h2><div class="meta" style="margin-bottom:8px">${esc(t('askIntro'))}</div>
    <div style="display:flex;gap:8px"><input type="text" class="nm" id="ask-q" placeholder="${esc(t('askPh'))}" aria-label="${esc(t('ask'))}" style="margin:0" onkeydown="if(event.key==='Enter')ask()"><button class="btn" id="ask-b" onclick="ask()">${esc(t('askBtn'))}</button></div>
    <div id="ask-out" role="status" aria-live="polite"></div></div>
  ${jobHtml(p)}
  <div class="card"><h2>${esc(t('updates'))}</h2>${p.updates.length?p.updates.map(u=>`<div class="up"><div class="up-b">${esc(u.body)}</div><div class="up-m">${esc(u.author||p.company.name)} · ${new Date(u.createdAt).toLocaleDateString(loc(), {month:'short',day:'numeric',year:'numeric'})}</div></div>`).join(''):`<div class="empty">${esc(t('noUpdates'))}</div>`}</div>
  <div class="card"><h2>${esc(t('photos'))}</h2>${photos.length?`<div class="grid">${photos.map(f=>`<a href="${fileUrl(f.id)}" target="_blank" rel="noopener" title="${esc(f.caption||f.filename)}"><img src="${fileUrl(f.id)}" alt="${esc(f.caption||t('projectPhoto'))}" loading="lazy"></a>`).join('')}</div>`:`<div class="empty">${esc(t('noPhotos'))}</div>`}
    <div style="margin-top:12px"><label class="btn btn-o" style="cursor:pointer">${esc(t('addPhotos'))}<input type="file" accept="image/*" multiple style="display:none" onchange="upload(this)"></label><div class="msg" id="up-msg"></div></div></div>
  ${docs.length||p.estimates.length?`<div class="card"><h2>${esc(t('documents'))}</h2>
    ${p.estimates.map(e=>`<div class="row"><a href="${esc(e.link)}${L==='es'?'?lang=es':''}">${esc(tm('estKind',e.kindKey,e.kind))} #${esc(e.number)}: ${esc(e.title)}</a><span class="tag">${esc(tm('estStatus',e.statusKey,e.status))} · ${money(e.total)}</span></div>`).join('')}
    ${docs.map(f=>`<div class="row"><a href="${fileUrl(f.id)}" target="_blank" rel="noopener">${esc(f.caption||f.filename)}</a><span class="tag">PDF</span></div>`).join('')}</div>`:''}
  ${homeHtml(p)}
  <div class="card"><h2>${esc(t('message',{co:p.company.name||t('us')}))}</h2>
    <textarea id="m" rows="4" placeholder="${esc(t('msgPh'))}" aria-label="${esc(t('yourMsg'))}"></textarea>
    <div style="margin-top:10px"><button class="btn" id="mb" onclick="send()">${esc(t('sendMsg'))}</button></div><div class="msg" id="m-msg" role="status"></div></div>`;
}
function homeHtml(p){
  const h=p.home||{items:[]};let out='';
  const fd=d=>d?new Date(d+'T12:00:00Z').toLocaleDateString(loc(), {month:'short',day:'numeric',year:'numeric'}):'';
  if(h.items.length)out+=`<div class="card"><h2>${esc(t('homeFile'))}</h2><div class="meta" style="margin-bottom:8px">${esc(t('homeIntro'))}</div>${h.items.map(i=>{const w=i.categoryKey==='warranty';return `<div style="border-top:1px solid #e3e7eb;padding:10px 0"><b>${esc(i.name)}</b>
    <div class="tag" style="margin-top:2px">${esc(tm('cat',i.categoryKey,i.category))}${i.installedOn&&!w?' · '+esc(t('installed',{d:fd(i.installedOn)})):''}${i.warrantyUntil?' · '+esc(t(w?'goodThrough':'warrantyThrough',{d:fd(i.warrantyUntil)})):''}</div>
    ${i.details?`<div class="meta">${esc(i.details)}</div>`:''}${i.careNote?`<div class="meta">${esc(i.careEveryMonths?t('careEvery',{n:i.careEveryMonths,s:pl(i.careEveryMonths),es:i.careEveryMonths===1?'':'es'}):t('care'))}: ${esc(i.careNote)}</div>`:''}</div>`;}).join('')}</div>`;
  if(h.referralCode){const link=location.origin+'/r/'+h.referralCode;out+=`<div class="card"><h2>${esc(t('refTitle'))}</h2><div class="meta">${esc(t('refIntro',{co:p.company.name||t('we')}))}</div>
    <div style="display:flex;gap:8px;margin-top:10px"><input type="text" class="nm" id="ref-link" readonly value="${esc(link)}" onclick="this.select()" style="margin:0"><button class="btn btn-o" onclick="shareRef(this)">${esc(t('share'))}</button></div></div>`;}
  return out;
}
function shareRef(b){const l=document.getElementById('ref-link').value;if(navigator.share){navigator.share({title:(P.company.name||'')+' ',url:l}).catch(()=>{});return;}(navigator.clipboard?navigator.clipboard.writeText(l):Promise.reject()).then(()=>{b.textContent=t('copied');}).catch(()=>{document.getElementById('ref-link').select();});}
function jobHtml(p){
  const j=p.job||{schedule:[],changeOrders:[],selections:[]};let out='';
  const fd=d=>d?new Date(d+'T12:00:00Z').toLocaleDateString(loc(), {month:'short',day:'numeric'}):'';
  const cos=j.changeOrders.filter(c=>c.status==='sent');
  if(cos.length)out+=`<div class="card"><h2>${esc(t('waiting'))}</h2>${cos.map(c=>`<div style="border-top:1px solid #e3e7eb;padding-top:10px;margin-top:10px"><b>${esc(t('co',{n:c.number,t:c.title}))}</b><div class="meta">${esc(t(c.amount>=0?'adds':'credits',{a:money(Math.abs(c.amount))}))}${c.daysAdded?esc(t('moreDays',{n:c.daysAdded,s:pl(c.daysAdded),es:c.daysAdded===1?'':'es'})):''}</div>${c.description?`<div class="up-b" style="margin-top:6px">${esc(c.description)}</div>`:''}
    <input type="text" class="nm" id="co-${c.id}" placeholder="${esc(t('typeName'))}" autocomplete="name" value="${esc(p.project.customer||'')}">
    <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><button class="btn" onclick="answerCO('${c.id}',true,this)">${esc(t('approve'))}</button><button class="btn btn-o" onclick="answerCO('${c.id}',false,this)">${esc(t('decline'))}</button></div></div>`).join('')}<div class="msg" id="co-msg"></div></div>`;
  const open=j.selections.filter(s=>s.chosen==null),done=j.selections.filter(s=>s.chosen!=null);
  if(j.selections.length)out+=`<div class="card"><h2>${esc(t('selections'))}</h2>${open.map(s=>`<div style="margin-bottom:14px"><b>${esc(s.category)}</b>${s.allowance?` <span class="tag">${esc(t('allowance',{a:money(s.allowance)}))}</span>`:''}${s.due?` <span class="tag">${esc(t('chooseBy',{d:fd(s.due)}))}</span>`:''}${s.note?`<div class="meta">${esc(s.note)}</div>`:''}
    ${s.options.map((o,i)=>`<label class="opt"><input type="radio" name="sel-${s.id}" value="${i}">${o.product_id&&o.photo?`<img src="/api/crm-public/portal/${token}/products/${o.product_id}/photo" alt="" loading="lazy" style="width:72px;height:72px;object-fit:cover;border-radius:8px;flex:0 0 auto">`:''}<span><b>${esc(o.name)}</b> · ${money(o.price)}${s.allowance&&o.price>s.allowance?` <span class="tag">${esc(t('over',{a:money(o.price-s.allowance)}))}</span>`:''}${o.note?`<br><span class="meta">${esc(o.note)}</span>`:''}</span></label>`).join('')}
    <button class="btn" style="margin-top:8px" onclick="choose('${s.id}',this)">${esc(t('choose'))}</button></div>`).join('')}
    ${done.map(s=>`<div class="row"><span>${esc(s.category)}</span><span class="tag">✓ ${esc((s.options[s.chosen]||{}).name||'')}</span></div>`).join('')}<div class="msg" id="sel-msg"></div></div>`;
  const pu=p.punch||[];
  if(pu.length)out+=`<div class="card"><h2>${esc(t('punch'))}</h2><div class="meta" style="margin-bottom:6px">${esc(t('punchIntro'))}</div>${pu.map(i=>`<div class="ph"><span class="dot ${i.status==='done'?'done':''}"></span><span style="flex:1;${i.status==='done'?'color:var(--ink3);text-decoration:line-through':''}">${i.location?'<b>'+esc(i.location)+':</b> ':''}${esc(i.issue)}</span></div>`).join('')}</div>`;
  if(j.schedule.length)out+=`<div class="card"><h2>${esc(t('schedule'))}</h2>${j.schedule.map(i=>`<div class="ph"><span class="dot ${i.status}"></span><span style="flex:1">${esc(i.title)}${i.status==='doing'?` <span class="tag">${esc(t('inProgress'))}</span>`:''}</span><span class="tag">${i.start?fd(i.start)+(i.end&&i.end!==i.start?' – '+fd(i.end):''):''}</span></div>`).join('')}<div class="small" style="font-size:12px;color:var(--ink3);margin-top:8px">${esc(t('shift'))}</div></div>`;
  return out;
}
async function ask(){
  const q=document.getElementById('ask-q'),b=document.getElementById('ask-b'),out=document.getElementById('ask-out');if(!q.value.trim())return;
  b.disabled=true;out.innerHTML=`<div class="msg">${esc(t('asking'))}</div>`;
  try{const r=await fetch(`/api/crm-public/portal/${token}/ask`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q.value})});const d=await r.json();if(!r.ok)throw new Error(d.error&&d.error.message);
    out.innerHTML=`<div class="visit" style="margin-top:10px"><div class="meta" style="font-weight:700">${esc(q.value)}</div><div style="margin-top:4px;white-space:pre-wrap">${esc(d.answer)}</div>${d.forwarded?`<div class="tag" style="margin-top:6px;white-space:normal">${esc(t('askFwd'))}</div>`:''}</div>`;q.value='';}
  catch(e){out.innerHTML=`<div class="msg" style="color:var(--err)">${esc(e.message||t('cantSend'))}</div>`;}
  b.disabled=false;
}
async function answerCO(id,approve,btn){
  const out=document.getElementById('co-msg');btn.disabled=true;out.textContent='';
  try{const r=await fetch(`/api/crm-public/portal/${token}/change-orders/${id}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({approve,name:(document.getElementById('co-'+id)||{}).value})});const d=await r.json();if(!r.ok)throw new Error(d.error&&d.error.message);await load();}
  catch(e){out.textContent=e.message||t('cantSave');out.style.color='var(--err)';btn.disabled=false;}
}
async function choose(id,btn){
  const pick=document.querySelector(`input[name="sel-${id}"]:checked`);const out=document.getElementById('sel-msg');
  if(!pick){out.textContent=t('pickFirst');out.style.color='var(--err)';return;}
  btn.disabled=true;
  try{const r=await fetch(`/api/crm-public/portal/${token}/selections/${id}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({index:+pick.value})});const d=await r.json();if(!r.ok)throw new Error(d.error&&d.error.message);await load();const o=document.getElementById('sel-msg');if(o){o.textContent=d.over>0?t('savedOver',{a:money(d.over)}):t('saved');o.style.color='var(--ok)';}}
  catch(e){out.textContent=e.message||t('cantSave');out.style.color='var(--err)';btn.disabled=false;}
}
async function send(){
  const m=document.getElementById('m'),b=document.getElementById('mb'),out=document.getElementById('m-msg');
  if(!m.value.trim())return;b.disabled=true;out.textContent='';
  try{const r=await fetch(`/api/crm-public/portal/${token}/messages`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m.value})});const d=await r.json();if(!r.ok)throw new Error(d.error&&d.error.message);m.value='';out.textContent=t('sent');out.style.color='var(--ok)';}
  catch(e){out.textContent=e.message||t('cantSend');out.style.color='var(--err)';}
  b.disabled=false;
}
// Photos from a phone: HEIC (iPhone) becomes JPEG, and very large photos are
// shrunk, in the browser, before they're sent. Other files pass through.
async function prepFile(f){
  const heic=/image\/hei[cf]/i.test(f.type)||/\.hei[cf]$/i.test(f.name);
  const bigPhoto=/^image\/(jpeg|png|webp)$/i.test(f.type)&&f.size>4*1024*1024;
  if(!heic&&!bigPhoto)return f;
  let bmp;
  try{bmp=await createImageBitmap(f);}
  catch(e){if(heic)throw new Error(f.name+' is an iPhone HEIC photo this browser can’t open. On the iPhone: Settings → Camera → Formats → Most Compatible, or share it as JPEG.');return f;}
  const scale=Math.min(1,2560/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=Math.round(bmp.width*scale);c.height=Math.round(bmp.height*scale);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.85));
  if(!blob)return f;
  return new File([blob],f.name.replace(/\.[^.]+$/,'')+'.jpg',{type:'image/jpeg'});
}
function readFile(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f);});}
async function upload(input){
  const out=document.getElementById('up-msg');const files=[...input.files];if(!files.length)return;
  out.textContent=t('uploading',{n:files.length,s:pl(files.length)});out.style.color='';
  let ok=0;
  for(let f of files){
    try{f=await prepFile(f);}catch(e){out.textContent=e.message;out.style.color='var(--err)';continue;}
    if(f.size>8*1024*1024){out.textContent=t('tooBig',{f:f.name});continue;}
    try{const r=await fetch(`/api/crm-public/portal/${token}/files`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:f.name,dataBase64:await readFile(f)})});const d=await r.json();if(!r.ok)throw new Error(d.error&&d.error.message);ok++;}
    catch(e){out.textContent=e.message||t('upFail');out.style.color='var(--err)';}
  }
  if(ok){await load();const o=document.getElementById('up-msg');if(o){o.textContent=t('added',{n:ok,s:pl(ok),them:ok>1?'them':'it'});o.style.color='var(--ok)';}}
}
load();
