<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Book a Visit</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f8;--card:#ffffff;--soft:#eef1f4;
  --ink:#14202b;--ink2:#3a4855;--ink3:#55636f;
  --bdr:#c3ccd4;--bdr2:#8794a0;--accent:#1f4e79;--accent2:#173b5c;--err:#a12a1f;
  --f:'Nunito Sans',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;-webkit-font-smoothing:antialiased}
.card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:28px 24px;box-shadow:0 2px 4px rgba(20,32,43,.04),0 10px 28px rgba(20,32,43,.08)}
.brand{font-size:24px;font-weight:800;text-align:center;color:var(--ink)}
.brand span{color:var(--accent)}
.tag{font-size:14px;color:var(--ink3);text-align:center;margin:4px 0 20px}
.tabs{display:flex;gap:4px;margin-bottom:16px;background:var(--soft);border-radius:9px;padding:4px}
.tab{flex:1;text-align:center;padding:10px;border-radius:6px;cursor:pointer;font-size:15px;font-weight:700;color:var(--ink3);border:0;background:transparent;font-family:var(--f)}
.tab.active{background:var(--accent);color:#fff}
label{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin:12px 0 5px}
input{width:100%;background:#fff;border:1.5px solid var(--bdr2);border-radius:8px;padding:12px 13px;font-family:var(--f);font-size:16px;color:var(--ink);outline:none}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,78,121,.12)}
.check{display:flex;gap:8px;align-items:flex-start;margin-top:14px;font-size:13px;color:var(--ink2)}
.check input{width:18px;height:18px;margin-top:2px;flex:0 0 auto}
.check a,.forgot{color:var(--accent)}
.btn{width:100%;margin-top:18px;padding:13px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-family:var(--f);font-size:16px;font-weight:800;cursor:pointer}
.btn:hover{background:var(--accent2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.err{color:var(--err);font-size:14px;margin-top:10px;min-height:20px}
.forgot{display:inline-block;margin-top:10px;font-size:14px}
.foot{font-size:13px;color:var(--ink3);text-align:center;margin-top:18px}
.foot a{color:var(--ink2)}
[hidden]{display:none!important}
.opt{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1.5px solid var(--bdr2);border-radius:10px;margin-top:8px;cursor:pointer;font-size:15px}
.opt input{width:18px;height:18px;flex:0 0 auto}
.opt:has(input:checked){border-color:var(--accent);background:rgba(31,78,121,.06)}
textarea{width:100%;background:#fff;border:1.5px solid var(--bdr2);border-radius:8px;padding:12px 13px;font-family:var(--f);font-size:16px;color:var(--ink);outline:none;resize:vertical}
.q{font-weight:800;font-size:15px;margin-top:18px}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-top:10px}
.day{flex:0 0 auto;border:1.5px solid var(--bdr2);border-radius:10px;padding:8px 10px;text-align:center;cursor:pointer;background:#fff;font-family:var(--f);font-size:13px;color:var(--ink)}
.day.on{border-color:var(--accent);background:var(--accent);color:#fff}
.times{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.time{border:1.5px solid var(--bdr2);border-radius:8px;padding:10px 4px;text-align:center;cursor:pointer;background:#fff;font-family:var(--f);font-size:15px;color:var(--ink)}
.time.on{border-color:var(--accent);background:rgba(31,78,121,.1);font-weight:800}
.ok{font-size:16px;text-align:center;padding:16px 0}
.hp{position:absolute;left:-5000px;width:1px;height:1px;overflow:hidden}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="card">
  <div class="brand" id="co" style="font-size:20px">Book a visit</div>
  <div class="tag" id="tag">Loading…</div>
  <div id="pick" hidden>
    <div class="q">Pick a day</div><div class="days" id="days"></div>
    <div class="q">Pick a time</div><div class="times" id="times"></div>
    <div id="who" hidden>
      <label for="name">Your name</label><input id="name" autocomplete="name">
      <label for="email">Email</label><input id="email" type="email" autocomplete="email" inputmode="email">
      <label for="phone">Phone</label><input id="phone" type="tel" autocomplete="tel" inputmode="tel">
      <label for="address">Project address</label><input id="address" autocomplete="street-address">
      <label for="notes">What's the project?</label><textarea id="notes" rows="2"></textarea>
      <div class="hp" aria-hidden="true"><input id="company_website" tabindex="-1" autocomplete="off"></div>
    </div>
    <button class="btn" id="b" onclick="book()">Book this time</button><div class="err" id="err" role="alert"></div>
  </div>
  <div id="done" hidden class="ok"></div>
</main>
<script>
const parts=location.pathname.split('/');const mode=parts[1]==='book'?'new':'deal';const key=parts.pop();
const api=mode==='new'?'/api/crm-public/book/'+key:'/api/crm-public/b/'+key;
let S=[],day=null,slot=null;
const dkey=iso=>new Date(iso).toLocaleDateString('en-CA',{timeZone:'America/Chicago'});
const fmtTime=iso=>new Date(iso).toLocaleTimeString([], {hour:'numeric',minute:'2-digit',timeZone:'America/Chicago'});
const fmtLong=iso=>new Date(iso).toLocaleString([], {weekday:'long',month:'long',day:'numeric',hour:'numeric',minute:'2-digit',timeZone:'America/Chicago'});
function render(){
  const days=[...new Set(S.map(dkey))];if(!day)day=days[0];
  document.getElementById('days').innerHTML=days.map(d=>{const dt=new Date(d+'T12:00:00Z');return `<button class="day${d===day?' on':''}" onclick="day='${d}';slot=null;render()">${dt.toLocaleDateString([], {weekday:'short',timeZone:'UTC'})}<br><b>${dt.toLocaleDateString([], {month:'short',day:'numeric',timeZone:'UTC'})}</b></button>`;}).join('');
  document.getElementById('times').innerHTML=S.filter(s=>dkey(s)===day).map(s=>`<button class="time${s===slot?' on':''}" onclick="slot='${s}';render()">${fmtTime(s)}</button>`).join('');
  document.getElementById('b').disabled=!slot;
}
fetch(api).then(r=>r.json().then(d=>{if(!r.ok)throw new Error(d.error&&d.error.message);
  document.getElementById('co').textContent=d.company;
  if(d.booked){document.getElementById('tag').innerHTML='You’re booked for <b>'+fmtLong(d.booked)+'</b>. Need a different time? Pick one below.';}
  else document.getElementById('tag').textContent=`A ${d.duration}-minute visit to see the space and talk through your project. Times are Central.`;
  S=d.slots;if(!S.length){document.getElementById('tag').textContent='No open times right now. Please call or message us and we’ll find one.';return;}
  if(mode==='new')document.getElementById('who').hidden=false;
  document.getElementById('pick').hidden=false;render();
})).catch(e=>{document.getElementById('tag').textContent=e.message||'This link is not valid.';});
function pageTags(){const q=new URLSearchParams(location.search),o={};['utm_source','utm_medium','utm_campaign','utm_term','utm_content','gclid','gbraid','wbraid','fbclid','msclkid'].forEach(k=>{const v=q.get(k);if(v)o[k]=v;});if(document.referrer&&!document.referrer.startsWith(location.origin))o.referrer=document.referrer;return Object.keys(o).length?o:undefined;}
async function book(){
  const b=document.getElementById('b'),err=document.getElementById('err');b.disabled=true;err.textContent='';
  const v=id=>(document.getElementById(id)||{}).value;
  const body=mode==='new'?{slot,name:v('name'),email:v('email'),phone:v('phone'),address:v('address'),notes:v('notes'),company_website:v('company_website'),utm:pageTags()}:{slot};
  try{const r=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw new Error((d.error&&d.error.message)||'Something went wrong.');
    document.getElementById('pick').hidden=true;const done=document.getElementById('done');done.hidden=false;done.innerHTML='✓ You’re booked for <b>'+fmtLong(d.at||slot)+'</b>.<br>We’ll send a reminder the day before.';
  }catch(x){err.textContent=x.message;b.disabled=false;}
}
</script>
</body>
</html>
