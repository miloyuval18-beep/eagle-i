<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Eagle I — Choose an Account</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Contrast pass — same verified palette as the main dashboard (see
     index.html's :root comment): ink/ink2/ink3 all clear WCAG AA
     everywhere they're used and AAA in most places; bdr2 now clears the
     3:1 non-text minimum for visible card/input borders. */
  --bg:#faf9f6;--bg-card:#ffffff;--bg-soft:#f1efea;
  --ink:#201e1a;--ink2:#423d37;--ink3:#524d45;
  --bdr:#bdb6a8;--bdr2:#8f8879;--bdr-strong:#201e1a;
  --f:'Nunito Sans',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;-webkit-font-smoothing:antialiased}
.card{width:100%;max-width:480px;background:var(--bg-card);border:1px solid var(--bdr);border-radius:14px;padding:32px;box-shadow:0 2px 4px rgba(32,30,26,.04),0 8px 24px rgba(32,30,26,.07)}
h1{font-size:24px;font-weight:800;letter-spacing:.2px;margin-bottom:6px}
.sub{font-size:15px;color:var(--ink3);margin-bottom:22px}
.page-row{background:#fff;border:1.5px solid var(--bdr2);border-radius:8px;padding:14px 16px;margin-bottom:10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:border-color .15s,background .15s}
.page-row:hover{border-color:var(--bdr-strong);background:var(--bg-soft)}
.page-name{font-size:16px;color:var(--ink)}
.page-go{font-size:14px;font-weight:700;color:var(--ink);text-decoration:underline}
.err{color:var(--ink);background:var(--bg-soft);border:1px solid var(--bdr2);border-radius:8px;padding:10px 12px;font-size:14px;font-weight:600;margin-top:12px;text-align:center;display:none}
.err::before{content:'⚠ '}
.status{font-size:15px;color:var(--ink2);margin-top:14px;text-align:center}
.page-row:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
</style>
</head>
<body>
<div class="card">
  <h1 id="title">Choose an account to connect</h1>
  <div class="sub" id="sub">Loading your options...</div>
  <div id="rows"><div class="status">Loading your options...</div></div>
  <div class="err" id="err"></div>
</div>

<script>
// This page handles the "pick one" step for every OAuth flow in this app
// that can return more than one connectable account/page/location — Meta
// Pages (organic + ads re-auth), Google Ads customer accounts, and Google
// Business Profile locations. Which one loaded is read from ?provider=.
const PROVIDERS={
  meta:{
    title:'Which Facebook Page is yours?', sub:'Your Facebook login manages more than one Page — click the one that belongs to your business below.',
    listUrl:'/api/social/meta/pending-pages', listKey:'pages',
    rowLabel:p=>p.name, rowKey:p=>p.id,
    selectUrl:'/api/social/meta/select-page', selectBody:id=>({pageId:id}),
    redirectOnSuccess:'/?social_connected=facebook'
  },
  meta_ads:{
    title:'Which Facebook Page is yours?', sub:'Your Facebook login manages more than one Page — click the one that belongs to your business below.',
    listUrl:'/api/social/meta/pending-pages', listKey:'pages',
    rowLabel:p=>p.name, rowKey:p=>p.id,
    selectUrl:'/api/social/meta/select-page', selectBody:id=>({pageId:id}),
    redirectOnSuccess:'/?ads_connected=meta'
  },
  google_ads:{
    title:'Which Google Ads account is yours?', sub:'Your Google login manages more than one ads account — click the one you want to use below.',
    listUrl:'/api/ads/google/pending-customers', listKey:'customerIds',
    rowLabel:id=>id, rowKey:id=>id,
    selectUrl:'/api/ads/google/select-customer', selectBody:id=>({customerId:id}),
    redirectOnSuccess:'/?ads_connected=google'
  },
  gbp:{
    title:'Which business listing is yours?', sub:'Your Google login manages more than one Google Business listing — click the one that belongs to your business below.',
    listUrl:'/api/gbp/pending-locations', listKey:'options',
    rowLabel:o=>o.locationName||o.locationId, rowKey:o=>o.locationId,
    selectUrl:'/api/gbp/select-location', selectBody:id=>({locationId:id}),
    redirectOnSuccess:'/?gbp_connected=1'
  }
};
const provider=PROVIDERS[new URLSearchParams(window.location.search).get('provider')]||PROVIDERS.meta;

async function load(){
  document.getElementById('title').textContent=provider.title;
  document.getElementById('sub').textContent=provider.sub;
  const wrap=document.getElementById('rows');
  const err=document.getElementById('err');
  try{
    const r=await fetch(provider.listUrl);
    const d=await r.json();
    const items=d[provider.listKey]||[];
    if(!items.length){
      wrap.innerHTML='';
      err.textContent="We couldn't find anything to connect — please go back to your dashboard and try clicking \"Connect\" again.";
      err.style.display='block';
      return;
    }
    wrap.innerHTML=items.map(item=>{
      const key=provider.rowKey(item).replace(/'/g,"\\'");
      return `<div class="page-row" onclick="choose('${key}')"><span class="page-name">${provider.rowLabel(item)}</span><span class="page-go">Connect →</span></div>`;
    }).join('');
  }catch(e){
    wrap.innerHTML='';
    err.textContent='Network error: '+e.message;
    err.style.display='block';
  }
}

async function choose(key){
  const err=document.getElementById('err');
  err.style.display='none';
  try{
    const r=await fetch(provider.selectUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(provider.selectBody(key))});
    const d=await r.json();
    if(!r.ok){
      err.textContent=d.error?.message||'Connection failed';
      err.style.display='block';
      return;
    }
    window.location.href=provider.redirectOnSuccess;
  }catch(e){
    err.textContent='Network error: '+e.message;
    err.style.display='block';
  }
}

load();
</script>
</body>
</html>
