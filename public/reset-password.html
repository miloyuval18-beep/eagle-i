<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Eagle I — Set New Password</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Contrast pass — same verified palette as the main dashboard (see
     index.html's :root comment): ink/ink2/ink3 all clear WCAG AA
     everywhere they're used and AAA in most places; bdr2 now clears the
     3:1 non-text minimum for visible card/input borders. */
  --bg:#faf9f6;--bg-card:#ffffff;--bg-soft:#f1efea;
  --ink:#201e1a;--ink2:#423d37;--ink3:#524d45;
  --bdr:#bdb6a8;--bdr2:#8f8879;--bdr-strong:#201e1a;
  --f:'Nunito Sans',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;-webkit-font-smoothing:antialiased}
.card{width:100%;max-width:420px;background:var(--bg-card);border:1px solid var(--bdr);border-radius:14px;padding:32px;box-shadow:0 2px 4px rgba(32,30,26,.04),0 8px 24px rgba(32,30,26,.07)}
h1{font-size:24px;font-weight:800;letter-spacing:.2px;margin-bottom:6px}
.sub{font-size:15px;color:var(--ink3);margin-bottom:24px}
label{display:block;font-size:14px;font-weight:600;color:var(--ink2);margin:14px 0 6px}
input{width:100%;background:#fff;border:1.5px solid var(--bdr2);border-radius:8px;padding:12px 13px;font-family:var(--f);font-size:16px;color:var(--ink);outline:none}
input:focus{border-color:var(--bdr-strong);box-shadow:0 0 0 3px rgba(32,30,26,.08)}
button.primary{width:100%;margin-top:22px;background:var(--ink);color:#fff;border:none;border-radius:8px;padding:14px;font-family:var(--f);font-size:16px;font-weight:700;cursor:pointer}
button.primary:hover{background:#000}
button.primary:disabled{opacity:.5;cursor:not-allowed}
.err{color:var(--ink);background:var(--bg-soft);border:1px solid var(--bdr2);border-radius:8px;padding:10px 12px;font-size:14px;font-weight:600;margin-top:14px;text-align:center;display:none}
.err::before{content:'⚠ '}
.status{font-size:15px;font-weight:600;color:var(--ink);background:var(--bg-soft);border:1px solid var(--bdr2);border-radius:8px;padding:12px;margin-top:16px;text-align:center;display:none}
.status::before{content:'✓ '}
a{color:var(--ink2);font-size:15px;text-decoration:underline;display:block;text-align:center;margin-top:18px}
.pw-wrap{position:relative}
.pw-wrap input{padding-right:62px}
.pw-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:6px;font-family:var(--f);font-size:13px;font-weight:700;color:var(--ink2);text-decoration:underline}
.pw-toggle:hover{color:var(--ink)}
.pw-mismatch{color:var(--ink);font-size:13px;font-weight:600;margin-top:6px;display:none}
.pw-mismatch::before{content:'⚠ '}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
</style>
</head>
<body>
<div class="card">
  <h1>Choose a new password</h1>
  <div class="sub">Type your new password twice below to make sure it's correct — it needs to be at least 8 characters long.</div>
  <form id="form">
    <label>New Password</label>
    <div class="pw-wrap">
      <input type="password" id="newPassword" required minlength="8" autocomplete="new-password">
      <button type="button" class="pw-toggle" onclick="togglePw('newPassword',this)">Show</button>
    </div>
    <label>Confirm New Password</label>
    <div class="pw-wrap">
      <input type="password" id="newPasswordConfirm" required minlength="8" autocomplete="new-password">
      <button type="button" class="pw-toggle" onclick="togglePw('newPasswordConfirm',this)">Show</button>
    </div>
    <div class="pw-mismatch" id="pw-mismatch">Passwords don't match.</div>
    <button class="primary" type="submit" id="submitBtn">Update Password</button>
  </form>
  <div class="status" id="status">Password updated — you can now sign in.</div>
  <div class="err" id="err"></div>
  <a href="/login.html">Back to sign in</a>
</div>
<script>
const token=new URLSearchParams(window.location.search).get('token');
if(!token){
  document.getElementById('form').style.display='none';
  const err=document.getElementById('err');
  err.textContent="This reset link is missing or no longer works. Go back and request a new one from the \"Forgot password?\" page.";
  err.style.display='block';
}
function togglePw(id,btn){
  const el=document.getElementById(id);
  const show=el.type==='password';
  el.type=show?'text':'password';
  btn.textContent=show?'Hide':'Show';
}
function checkPwMatch(){
  const newPassword=document.getElementById('newPassword').value;
  const confirm=document.getElementById('newPasswordConfirm').value;
  const mismatch=confirm.length>0 && newPassword!==confirm;
  document.getElementById('pw-mismatch').style.display=mismatch?'block':'none';
  return !mismatch;
}
document.getElementById('newPassword').addEventListener('input', checkPwMatch);
document.getElementById('newPasswordConfirm').addEventListener('input', checkPwMatch);
document.getElementById('form').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const btn=document.getElementById('submitBtn');
  const status=document.getElementById('status');
  const err=document.getElementById('err');
  err.style.display='none';
  const newPassword=document.getElementById('newPassword').value;
  const newPasswordConfirm=document.getElementById('newPasswordConfirm').value;
  if(newPassword!==newPasswordConfirm){ checkPwMatch(); err.textContent="Passwords don't match."; err.style.display='block'; return; }
  btn.disabled=true;
  try{
    const r=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,newPassword})});
    const d=await r.json();
    if(!r.ok){
      err.textContent=d.error?.message||'Failed to reset password';
      err.style.display='block';
      btn.disabled=false;
      return;
    }
    status.style.display='block';
    document.getElementById('form').style.display='none';
  }catch(e){
    err.textContent='Network error: '+e.message;
    err.style.display='block';
    btn.disabled=false;
  }
});
</script>
</body>
</html>
