<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Eagle I — Set New Password</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Exo+2:wght@400;500&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#04070e;--bg3:#0a1626;--bg5:#152845;--bdr2:rgba(30,140,255,.20);
--ink:#e0eaf8;--ink2:#6e96c0;--ink3:#2e5070;--blue:#1a7ee8;--blue2:#3aa0ff;--green:#00d97a;--red:#ff2d4a;
--fh:'Rajdhani',sans-serif;--fb:'Exo 2',sans-serif;--fm:'Share Tech Mono',monospace;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:420px;background:var(--bg3);border:1px solid var(--bdr2);border-radius:14px;padding:32px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
h1{font-family:var(--fh);font-size:22px;letter-spacing:1px;margin-bottom:6px}
.sub{font-family:var(--fm);font-size:10px;color:var(--blue2);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:22px}
label{display:block;font-family:var(--fm);font-size:9px;color:var(--ink3);text-transform:uppercase;letter-spacing:1.5px;margin:14px 0 5px}
input{width:100%;background:var(--bg5);border:1px solid var(--bdr2);border-radius:7px;padding:10px 12px;font-family:var(--fb);font-size:14px;color:var(--ink);outline:none}
button.primary{width:100%;margin-top:20px;background:var(--blue);color:#fff;border:none;border-radius:7px;padding:13px;font-family:var(--fh);font-size:15px;font-weight:600;letter-spacing:1px;cursor:pointer;text-transform:uppercase}
button.primary:hover{background:var(--blue2)}
button.primary:disabled{opacity:.5;cursor:not-allowed}
.err{color:var(--red);font-size:12px;margin-top:12px;text-align:center;display:none}
.status{font-family:var(--fm);font-size:11px;color:var(--green);margin-top:14px;text-align:center;display:none}
a{color:var(--blue2);font-size:12px;display:block;text-align:center;margin-top:16px}
</style>
</head>
<body>
<div class="card">
  <h1>Set a new password</h1>
  <div class="sub">Choose a new password (min 8 characters)</div>
  <form id="form">
    <label>New Password</label>
    <input type="password" id="newPassword" required minlength="8" autocomplete="new-password">
    <button class="primary" type="submit" id="submitBtn">Update Password</button>
  </form>
  <div class="status" id="status">Password updated — you can now sign in.</div>
  <div class="err" id="err"></div>
  <a href="/login.html">Back to sign in</a>
</div>
<script>
const token=new URLSearchParams(window.location.search).get('token');
if(!token){
  document.getElementById('form').style.display='none';
  const err=document.getElementById('err');
  err.textContent='Missing or invalid reset link.';
  err.style.display='block';
}
document.getElementById('form').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const btn=document.getElementById('submitBtn');
  const status=document.getElementById('status');
  const err=document.getElementById('err');
  err.style.display='none';
  btn.disabled=true;
  const newPassword=document.getElementById('newPassword').value;
  try{
    const r=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,newPassword})});
    const d=await r.json();
    if(!r.ok){
      err.textContent=d.error?.message||'Failed to reset password';
      err.style.display='block';
      btn.disabled=false;
      return;
    }
    status.style.display='block';
    document.getElementById('form').style.display='none';
  }catch(e){
    err.textContent='Network error: '+e.message;
    err.style.display='block';
    btn.disabled=false;
  }
});
</script>
</body>
</html>
