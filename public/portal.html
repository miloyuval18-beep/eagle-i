<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex">
<title>Your Project</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- The homeowner's project portal from Eagle I CRM (routes/crmPortal.js).
     It opens on an assistant for questions about their project (lib/crmPortalAi.js);
     "My project" shows only what the team shared: status, visits, estimates, photos,
     documents and updates. Never costs, notes or internal history. -->
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#14202b;--ink2:#3a4855;--ink3:#55636f;--bdr:#c3ccd4;--bdr2:#8794a0;--accent:#1f4e79;--accent2:#173b5c;--ok:#2c6e49;--err:#a12a1f;--f:'Nunito Sans',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:18.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:18px;margin-bottom:14px}
.co{font-size:17px;color:var(--ink3);overflow-wrap:anywhere}
h1{font-size:25px;line-height:1.25;margin:4px 0;overflow-wrap:anywhere}
h2{font-size:19.5px;margin-bottom:10px}
.pill{display:inline-block;font-size:16px;font-weight:800;border-radius:999px;padding:3px 11px;background:rgba(31,78,121,.1);color:var(--accent);border:1px solid var(--accent)}
.meta{font-size:17px;color:var(--ink2)}
.visit{margin-top:12px;padding:10px 12px;border-radius:10px;background:#eef4fa;font-size:17.5px}
.up{border-top:1px solid #e3e7eb;padding:12px 0}
.up:first-of-type{border-top:0;padding-top:0}
.up-b{white-space:pre-wrap;overflow-wrap:anywhere}
.up-m{font-size:15px;color:var(--ink3);margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid a{display:block;aspect-ratio:1;border-radius:8px;overflow:hidden;background:#e3e7eb}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-top:1px solid #e3e7eb;font-size:17.5px}
.row:first-child{border-top:0}
.row a{color:var(--accent);font-weight:700;overflow-wrap:anywhere}
.tag{font-size:15px;color:var(--ink3);white-space:nowrap}
textarea{width:100%;border:1.5px solid var(--bdr2);border-radius:8px;padding:11px 12px;font-family:var(--f);font-size:18.5px;color:var(--ink);resize:vertical}
textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,78,121,.12)}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:6px;border:0;border-radius:8px;padding:12px 16px;font-family:var(--f);font-size:18.5px;font-weight:800;cursor:pointer;background:var(--accent);color:#fff}
.btn:disabled{opacity:.5}
.btn-o{background:#fff;border:1.5px solid var(--bdr2);color:var(--ink)}
.msg{font-size:17px;margin-top:8px;min-height:18px}
.empty{font-size:17px;color:var(--ink3)}
.foot{font-size:15px;color:var(--ink3);text-align:center;margin:16px 0 30px}
.ph{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid #e3e7eb;font-size:17.5px}
.ph:first-of-type{border-top:0}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--bdr);flex:0 0 auto;margin-top:6px}
.dot.doing{border-color:var(--accent);background:#cfe0ef}.dot.done{border-color:var(--ok);background:var(--ok)}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1.5px solid var(--bdr);border-radius:10px;margin-top:8px;cursor:pointer}
.opt input{margin-top:4px;width:18px;height:18px;flex:0 0 auto}
.opt.chosen{border-color:var(--ok);background:rgba(44,110,73,.06)}
input[type=text].nm{width:100%;border:1.5px solid var(--bdr2);border-radius:8px;padding:11px 12px;font-family:var(--f);font-size:18.5px;margin-top:8px}
@media(max-width:420px){.grid{grid-template-columns:repeat(2,1fr)}}
.lang{background:none;border:0;color:var(--accent);font-family:inherit;font-size:17px;font-weight:700;cursor:pointer;padding:6px 8px}
/* header and tabs */
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #e4e7ec}
.bar{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
.hco{font-weight:700;font-size:18.5px;letter-spacing:-.01em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hco small{display:block;font-weight:500;font-size:15px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis}
.tabs{max-width:760px;margin:0 auto;display:flex;gap:4px;padding:0 12px}
.tab{flex:1;white-space:nowrap;border:0;background:none;font:inherit;font-weight:600;font-size:17.5px;color:var(--ink3);padding:10px 8px;border-bottom:2px solid transparent;cursor:pointer;min-height:44px}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.dotn{display:inline-block;min-width:18px;height:18px;line-height:18px;border-radius:9px;background:#b42318;color:#fff;font-size:14px;font-weight:700;padding:0 5px;margin-left:4px;vertical-align:1px}
/* the project assistant */
.chat{max-width:760px;margin:0 auto;padding:0 16px;display:flex;flex-direction:column;height:calc(100vh - var(--hh,100px));height:calc(100dvh - var(--hh,100px))}
.msgs{flex:1;overflow-y:auto;padding:18px 0 10px}
.hello{text-align:center;padding:14px 4px 6px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:600;color:#fff;background:linear-gradient(135deg,#163d70 0%,#1d4f91 45%,#0f8b8d 100%);border-radius:999px;padding:4px 12px;letter-spacing:.02em}
.hello h1{font-size:28px;margin-top:12px}
.hello p{color:var(--ink3);margin:8px auto 0;max-width:470px;font-size:17.5px}
.nudge{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;margin:16px 0 0;padding:12px 14px;border-radius:12px;background:#fffaeb;border:1px solid #fedf89;font-size:17.5px}
.nudge button{flex:0 0 auto;border:0;background:#1d4f91;color:#fff;font:inherit;font-weight:600;font-size:17px;border-radius:10px;padding:9px 13px;cursor:pointer;min-height:40px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.chip{text-align:left;border:1px solid #e4e7ec;background:#fff;border-radius:12px;padding:11px 13px;font:inherit;font-size:17px;color:var(--ink);cursor:pointer;box-shadow:0 1px 3px rgba(16,24,40,.07),0 1px 2px rgba(16,24,40,.04)}
.chip:hover{border-color:#b9cfea}
.m{display:flex;margin:10px 0}.m.me{justify-content:flex-end}
.bw{max-width:100%;display:flex;flex-direction:column}
.b{max-width:86%;padding:10px 13px;border-radius:16px;font-size:17.5px;line-height:1.5;overflow-wrap:anywhere;white-space:pre-wrap}
.me .bw{align-items:flex-end}.bot .bw{align-items:flex-start}
.me .b{background:linear-gradient(135deg,#163d70 0%,#1d4f91 45%,#0f8b8d 100%);color:#fff;border-bottom-right-radius:5px}
.bot .b{background:#fff;border:1px solid #e4e7ec;border-bottom-left-radius:5px;box-shadow:0 1px 3px rgba(16,24,40,.07)}
.fwd{font-size:15px;color:var(--ink3);margin-top:4px}
.flinks{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.flinks a{font-size:16px;font-weight:600;color:var(--accent);background:#eef4fb;border:1px solid #b9cfea;border-radius:999px;padding:5px 11px;text-decoration:none;overflow-wrap:anywhere}
.cfoot{padding:8px 0 calc(10px + env(safe-area-inset-bottom));background:var(--bg)}
.comp{display:flex;gap:6px;align-items:flex-end;background:#fff;border:1px solid var(--bdr2);border-radius:16px;padding:6px;box-shadow:0 1px 3px rgba(16,24,40,.07)}
.comp:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px rgba(29,79,145,.14)}
.comp textarea{flex:1;min-width:0;border:0!important;outline:none;resize:none;font:inherit;font-size:18.5px;line-height:1.45;height:38px;max-height:130px;padding:7px 6px;background:transparent;box-shadow:none!important}
.send{border:0;width:40px;height:40px;border-radius:12px;color:#fff;background:linear-gradient(135deg,#163d70 0%,#1d4f91 45%,#0f8b8d 100%);font-size:20.5px;cursor:pointer;flex:0 0 auto}
.send:disabled{opacity:.4}
.mic{border:0;background:none;width:40px;height:40px;border-radius:10px;font-size:20.5px;cursor:pointer;flex:0 0 auto}
.mic.rec{background:var(--err);color:#fff}
.hint{font-size:15px;color:var(--ink3);text-align:center;margin-top:6px}
#app{padding-top:16px}
@media(max-width:420px){.chips{grid-template-columns:1fr}.hello h1{font-size:25px}}
[hidden]{display:none!important}
</style>
<link rel="stylesheet" href="/eaglei-theme.css">
</head>
<body>
<header class="top" id="top">
  <div class="bar"><div class="hco" id="hco">&nbsp;<small id="hwho"></small></div><button type="button" class="lang" id="lang-btn" onclick="toggleLang()">Español</button></div>
  <nav class="tabs"><button class="tab on" id="t-ask" onclick="show('ask')">✦ <span data-t="askTabShort">Project questions</span></button><button class="tab" id="t-proj" onclick="show('proj')"><span data-t="projTab">My project</span><span id="nwait"></span></button></nav>
</header>
<section id="v-ask" class="chat">
  <div class="msgs" id="msgs"></div>
  <div class="cfoot">
    <div style="display:flex;justify-content:flex-end;margin:0 0 6px"><button class="et-toggle" id="mode-btn" type="button" onclick="toggleMode()" hidden></button></div>
    <div id="talk" hidden></div>
    <div class="comp"><textarea id="q" rows="1" aria-label="Your question" oninput="grow(this)" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();askIt();}"></textarea><button class="mic" id="mic" onclick="mic()" aria-label="Talk" hidden>🎤</button><button class="send" id="go" onclick="askIt()" aria-label="Send">↑</button></div>
    <div class="hint" id="hint"></div>
  </div>
</section>
<div id="v-proj" hidden>
<div class="wrap" id="app"><div class="card">Loading your project…</div></div>
<div class="foot">Powered by Eagle I CRM</div>
</div>
<script src="/talk.js"></script>

let L=(()=>{const q=new URLSearchParams(location.search).get('lang');if(q)return q==='es'?'es':'en';try{const s=localStorage.getItem('eaglei_lang');if(s)return s;}catch(e){}return /^es/i.test(navigator.language||'')?'es':'en';})();
let chosenLang=!!new URLSearchParams(location.search).get('lang');try{if(localStorage.getItem('eaglei_lang'))chosenLang=true;}catch(e){}
const t=(k,v)=>String((T[L]||T.en)[k]??T.en[k]??k).replace(/\{(\w+)\}/g,(m,x)=>(v||{})[x]??'');
const tm=(group,key,fallback)=>((T[L]||T.en)[group]||{})[key]||fallback||key;
const pl=n=>n===1?'':'s';
const loc=()=>L==='es'?'es-US':'en-US';
function toggleLang(){L=L==='es'?'en':'es';chosenLang=true;try{localStorage.setItem('eaglei_lang',L);}catch(e){}setLangBtn();if(P){render();applyMode();}}
function setLangBtn(){document.documentElement.lang=L;document.getElementById('lang-btn').textContent=L==='es'?'English':'Español';
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));document.getElementById('q').placeholder=t('ph');document.getElementById('hint').textContent=t('hint');}
function show(v){document.getElementById('v-ask').hidden=v!=='ask';document.getElementById('v-proj').hidden=v!=='proj';document.getElementById('t-ask').classList.toggle('on',v==='ask');document.getElementById('t-proj').classList.toggle('on',v==='proj');if(v==='proj')window.scrollTo(0,0);}
function fitChat(){document.documentElement.style.setProperty('--hh',document.getElementById('top').offsetHeight+'px');}
addEventListener('resize',fitChat);
function grow(e){e.style.height='38px';e.style.height=Math.min(130,e.scrollHeight)+'px';}
setLangBtn();fitChat();document.querySelector('#app .card').textContent=t('loading');document.getElementById('msgs').innerHTML=`<div class="hello"><span class="badge">${esc(t('badge'))}</span><p>${esc(t('loading'))}</p></div>`;
let P=null;
async function load(){
  try{
    const r=await fetch('/api/crm-public/portal/'+token);const d=await r.json();
    if(!r.ok)throw new Error((d.error&&d.error.message)||t('invalid'));
    P=d.portal;if(P.lang==='es'&&!chosenLang)L='es';setLangBtn();render();setupTalk();
  }catch(e){document.getElementById('app').innerHTML='<div class="card">'+esc(e.message)+'</div>';document.getElementById('msgs').innerHTML=`<div class="hello"><p>${esc(e.message)}</p></div>`;}
}
function render(){
  const p=P,photos=p.files.filter(f=>f.kind==='photo'),docs=p.files.filter(f=>f.kind!=='photo');
  document.title=p.project.title+' · '+(p.company.name||'');
  document.getElementById('hco').innerHTML=esc(p.company.name||'')+`<small>${esc(p.project.title)}</small>`;
  const nw=waitingCount(p);document.getElementById('nwait').innerHTML=nw?`<span class="dotn">${nw}</span>`:'';
  fitChat();if(!STARTED)hello();
  document.getElementById('app').innerHTML=`
  <div class="card">
    <div class="co">${esc(p.company.name)}${p.company.phone?' · '+esc(p.company.phone):''}</div>
    <h1>${esc(p.project.title)}</h1>
    <div class="meta">${esc(p.project.customer)}${p.project.address?' · '+esc(p.project.address):''}</div>
    <div style="margin-top:10px"><span class="pill">${esc(tm('status',p.project.stageKey,p.project.status))}</span></div>
    ${p.nextVisit?`<div class="visit">📅 ${esc(t('nextVisit'))}: <b>${new Date(p.nextVisit).toLocaleString(loc(), {weekday:'long',month:'long',day:'numeric',hour:'numeric',minute:'2-digit'})}</b></div>`:''}
  </div>
  ${jobHtml(p)}

  <div class="card"><h2>${esc(t('photos'))}</h2>${photos.length?`<div class="grid">${photos.map(f=>`<a href="${fileUrl(f.id)}" target="_blank" rel="noopener" title="${esc(f.caption||f.filename)}"><img src="${fileUrl(f.id)}" alt="${esc(f.caption||t('projectPhoto'))}" loading="lazy"></a>`).join('')}</div>`:`<div class="empty">${esc(t('noPhotos'))}</div>`}
    <div style="margin-top:12px"><label class="btn btn-o" style="cursor:pointer">${esc(t('addPhotos'))}<input type="file" accept="image/*" multiple style="display:none" onchange="upload(this)"></label><div class="msg" id="up-msg"></div></div></div>
  ${docs.length||p.estimates.length?`<div class="card"><h2>${esc(t('documents'))}</h2>
    ${p.estimates.map(e=>`<div class="row"><a href="${esc(e.link)}${L==='es'?'?lang=es':''}">${esc(tm('estKind',e.kindKey,e.kind))} #${esc(e.number)}: ${esc(e.title)}</a><span class="tag">${esc(tm('estStatus',e.statusKey,e.status))} · ${money(e.total)}</span></div>`).join('')}
    ${docs.map(f=>`<div class="row"><a href="${fileUrl(f.id)}" target="_blank" rel="noopener">${esc(f.caption||f.filename)}</a><span class="tag">${esc(ftag(f))}</span></div>`).join('')}</div>`:''}
  ${homeHtml(p)}
  <div class="card"><h2>${esc(t('message',{co:p.company.name||t('us')}))}</h2>
    <textarea id="m" rows="4" placeholder="${esc(t('msgPh'))}" aria-label="${esc(t('yourMsg'))}"></textarea>
    <div style="margin-top:10px"><button class="btn" id="mb" onclick="send()">${esc(t('sendMsg'))}</button></div><div class="msg" id="m-msg" role="status"></div></div>`;
}
function ftag(f){const t=f.type||'';return /pdf/.test(t)?'PDF':/video/.test(t)?'Video':/word|msword/.test(t)?'Word':/sheet|excel|csv/.test(t)?'Excel':/acad|dxf/.test(t)?'CAD':'File';}
function homeHtml(p){
  const h=p.home||{items:[]};let out='';
  const fd=d=>d?new Date(d+'T12:00:00Z').toLocaleDateString(loc(), {month:'short',day:'numeric',year:'numeric'}):'';
  if(h.items.length)out+=`<div class="card"><h2>${esc(t('homeFile'))}</h2><div class="meta" style="margin-bottom:8px">${esc(t('homeIntro'))}</div>${h.items.map(i=>{const w=i.categoryKey==='warranty';return `<div style="border-top:1px solid #e3e7eb;padding:10px 0"><b>${esc(i.name)}</b>
    <div class="tag" style="margin-top:2px">${esc(tm('cat',i.categoryKey,i.category))}${i.installedOn&&!w?' · '+esc(t('installed',{d:fd(i.installedOn)})):''}${i.warrantyUntil?' · '+esc(t(w?'goodThrough':'warrantyThrough',{d:fd(i.warrantyUntil)})):''}</div>
    ${i.details?`<div class="meta">${esc(i.details)}</div>`:''}${i.careNote?`<div class="meta">${esc(i.careEveryMonths?t('careEvery',{n:i.careEveryMonths,s:pl(i.careEveryMonths),es:i.careEveryMonths===1?'':'es'}):t('care'))}: ${esc(i.careNote)}</div>`:''}</div>`;}).join('')}</div>`;
  if(h.referralCode){const link=location.origin+'/r/'+h.referralCode;out+=`<div class="card"><h2>${esc(t('refTitle'))}</h2><div class="meta">${esc(t('refIntro',{co:p.company.name||t('we')}))}</div>
    <div style="display:flex;gap:8px;margin-top:10px"><input type="text" class="nm" id="ref-link" readonly value="${esc(link)}" onclick="this.select()" style="margin:0"><button class="btn btn-o" onclick="shareRef(this)">${esc(t('share'))}</button></div></div>`;}
  return out;

function shareRef(b){const l=document.getElementById('ref-link').value;if(navigator.share){navigator.share({title:(P.company.name||'')+' ',url:l}).catch(()=>{});return;}(navigator.clipboard?navigator.clipboard.writeText(l):Promise.reject()).then(()=>{b.textContent=t('copied');}).catch(()=>{document.getElementById('ref-link').select();});}
function jobHtml(p){
  const j=p.job||{schedule:[],changeOrders:[],selections:[]};let out='';
  const fd=d=>d?new Date(d+'T12:00:00Z').toLocaleDateString(loc(), {month:'short',day:'numeric'}):'';

    <input type="text" class="nm" id="co-${c.id}" placeholder="${esc(t('typeName'))}" autocomplete="name" value="${esc(p.project.customer||'')}">

    out+=`<div class="card"><h2>${esc(t('coHist'))}</h2>${decided.map(c=>`<div class="row"><span>#${esc(c.number)} ${esc(c.title)}<br><span class="tag" style="white-space:normal">${c.status==='approved'?esc(t('coApproved',{n:c.approvedName||'',d:c.approvedAt?new Date(c.approvedAt).toLocaleDateString(loc(), {month:'short',day:'numeric',year:'numeric'}):''})):esc(t('coDeclined'))}</span></span><span class="tag">${c.status==='approved'?(Number(c.amount)>=0?'+':'')+money(c.amount):'—'}</span></div>`).join('')}
      <div class="row" style="font-weight:700"><span>${esc(t('coNet'))}</span><span>${(net>=0?'+':'')+money(net)}</span></div></div>`;}
  const open=j.selections.filter(s=>s.chosen==null),done=j.selections.filter(s=>s.chosen!=null);
  if(j.selections.length)out+=`<div class="card"><h2>${esc(t('selections'))}</h2>${open.map(s=>`<div style="margin-bottom:14px"><b>${esc(s.category)}</b>${s.allowance?` <span class="tag">${esc(t('allowance',{a:money(s.allowance)}))}</span>`:''}${s.due?` <span class="tag">${esc(t('chooseBy',{d:fd(s.due)}))}</span>`:''}${s.note?`<div class="meta">${esc(s.note)}</div>`:''}
    ${s.options.map((o,i)=>`<label class="opt"><input type="radio" name="sel-${s.id}" value="${i}">${o.product_id&&o.photo?`<img src="/api/crm-public/portal/${token}/products/${o.product_id}/photo" alt="" loading="lazy" style="width:72px;height:72px;object-fit:cover;border-radius:8px;flex:0 0 auto">`:''}<span><b>${esc(o.name)}</b> · ${money(o.price)}${s.allowance&&o.price>s.allowance?` <span class="tag">${esc(t('over',{a:money(o.price-s.allowance)}))}</span>`:''}${o.note?`<br><span class="meta">${esc(o.note)}</span>`:''}</span></label>`).join('')}
    <button class="btn" style="margin-top:8px" onclick="choose('${s.id}',this)">${esc(t('choose'))}</button></div>`).join('')}
    ${done.map(s=>`<div class="row"><span>${esc(s.category)}</span><span class="tag">✓ ${esc((s.options[s.chosen]||{}).name||'')}</span></div>`).join('')}<div class="msg" id="sel-msg"></div></div>`;
  const pu=p.punch||[];

  if(j.schedule.length)out+=`<div class="card"><h2>${esc(t('schedule'))}</h2>${j.schedule.map(i=>`<div class="ph"><span class="dot ${i.status}"></span><span style="flex:1">${esc(i.title)}${i.status==='doing'?` <span class="tag">${esc(t('inProgress'))}</span>`:''}</span><span class="tag">${i.start?fd(i.start)+(i.end&&i.end!==i.start?' – '+fd(i.end):''):''}</span></div>`).join('')}<div class="small" style="font-size:15px;color:var(--ink3);margin-top:8px">${esc(t('shift'))}</div></div>`;

// ---------- the project assistant ----------
let STARTED=false,BUSY=false;const HIST=[];
function waitingCount(p){const j=p.job||{changeOrders:[],selections:[]};return j.changeOrders.filter(c=>c.status==='sent').length+j.selections.filter(s=>s.chosen==null).length+p.estimates.filter(e=>e.statusKey==='sent').length;}
function suggestions(p){
  const j=p.job||{schedule:[],changeOrders:[],selections:[]},out=[];
  const building=['signed','production'].includes(p.project.stageKey),done=p.project.stageKey==='complete';
  if(waitingCount(p))out.push('qWait');
  if(j.selections.some(s=>s.chosen==null))out.push('qPick');
  if(p.nextVisit)out.push('qVisit');
  if(building||j.schedule.length)out.push('qWeek','qDone');else if(!done)out.push('qNext');
  if(done&&(p.home||{}).items&&p.home.items.length)out.push('qWarr');
  if(p.files.some(f=>f.kind!=='photo')||p.estimates.length)out.push('qDocs');
  if(j.selections.some(s=>s.chosen!=null))out.push('qPicked');
  if(j.changeOrders.some(c=>c.status==='approved'))out.push('qChanged');
  out.push('qPaid','qNext','qTeam');
  return [...new Set(out)].slice(0,6);
}
function hello(){
  const p=P,first=String(p.project.customer||'').trim().split(/\s+/)[0]||'';const nw=waitingCount(p);
  document.getElementById('msgs').innerHTML=`<div class="hello"><span class="badge">${esc(t('badge'))}</span><h1>${esc(first?t('hi',{n:first}):t('askTab'))}</h1><p>${esc(t('intro',{co:p.company.name||t('us')}))}</p>
    ${nw?`<div class="nudge"><span>⏳ <b>${esc(t('needs',{n:nw,s:pl(nw)}))}</b></span><button onclick="show('proj')">${esc(t('needsBtn'))}</button></div>`:''}
    <div class="chips">${suggestions(p).map(k=>`<button class="chip" onclick="chip(this)">${esc(t(k))}</button>`).join('')}</div></div>`;
}
function chip(b){document.getElementById('q').value=b.textContent;askIt();}
function bubble(who,html,extra=''){const d=document.createElement('div');d.className='m '+(who==='me'?'me':'bot');d.innerHTML=`<div class="bw"><div class="b">${html}</div>${extra}</div>`;const m=document.getElementById('msgs');m.appendChild(d);m.scrollTop=m.scrollHeight;return d;}
// Documents the answer names, as links (only ones already on this page).
function docLinks(answer){
  const a=String(answer).toLowerCase(),out=[];
  for(const f of P.files.filter(f=>f.kind!=='photo')){const n=String(f.caption||f.filename),base=n.replace(/\.[a-z0-9]{2,5}$/i,'').toLowerCase();if(base.length>=3&&a.includes(base))out.push(`<a href="${fileUrl(f.id)}" target="_blank" rel="noopener">📄 ${esc(n)}</a>`);}
  for(const e of P.estimates){if(a.includes('#'+e.number)||a.includes(String(e.title).toLowerCase()))out.push(`<a href="${esc(e.link)}${L==='es'?'?lang=es':''}">📄 ${esc(tm('estKind',e.kindKey,e.kind))} #${esc(e.number)}</a>`);}
  return out.length?`<div class="flinks">${out.slice(0,6).join('')}</div>`:'';
}
async function askIt(pre,voice){
  const q=document.getElementById('q');const text=(pre!=null?String(pre):q.value).trim();if(!text||BUSY||!P)return null;
  if(!STARTED){STARTED=true;document.getElementById('msgs').innerHTML='';}
  BUSY=true;document.getElementById('go').disabled=true;bubble('me',esc(text));q.value='';grow(q);
  const th=bubble('bot',esc(t('asking')));
  try{const r=await fetch(`/api/crm-public/portal/${token}/ask`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:text,history:HIST.slice(-8),voice:!!voice})});const d=await r.json();if(!r.ok)throw new Error(d.error&&d.error.message);
    th.remove();bubble('bot',esc(d.answer),docLinks(d.answer)+(d.forwarded?`<div class="fwd">${esc(t('askFwd'))}</div>`:''));HIST.push({who:'me',text},{who:'bot',text:d.answer});
    BUSY=false;document.getElementById('go').disabled=false;if(!voice)q.focus();return d.answer;}
  catch(e){th.remove();bubble('bot',`<span style="color:var(--err)">${esc(e.message||t('oops'))}</span>`);BUSY=false;document.getElementById('go').disabled=false;if(!voice)q.focus();return e.message||t('oops');}
}
/* Talk or type (public/talk.js): asked the first time, saved with the homeowner; the button switches any time. */
let MODE=null,TALK=null,ASKED=false;
const TW={en:{q:'How would you like to ask about your project?',sub:'You can switch any time with the button above the chat.',talk:['Talk','Like a phone call. You speak, it answers out loud.'],type:['Type','Like texting. You type, it writes back.'],noMic:'This browser can’t listen. Try Safari on iPhone or Chrome.',toTalk:'🎙 Talk',toType:'⌨️ Type'},
  es:{q:'¿Cómo prefiere preguntar sobre su proyecto?',sub:'Puede cambiarlo cuando quiera con el botón encima del chat.',talk:['Hablar','Como una llamada. Usted habla y le responde en voz alta.'],type:['Escribir','Como un mensaje. Usted escribe y le responde por escrito.'],noMic:'Este navegador no puede escuchar. Pruebe Safari en iPhone o Chrome.',toTalk:'🎙 Hablar',toType:'⌨️ Escribir'}};
const tw=k=>TW[L==='es'?'es':'en'][k];
function applyMode(){
  const talk=MODE==='talk'&&EagleTalk.can();const b=document.getElementById('mode-btn');
  b.hidden=!EagleTalk.can();b.textContent=talk?tw('toType'):tw('toTalk');
  document.getElementById('talk').hidden=!talk;document.querySelector('.comp').style.display=talk?'none':'';
  if(talk&&!TALK)TALK=EagleTalk.mount(document.getElementById('talk'),{lang:()=>L,ask:(text)=>askIt(text,true),toggle:'#mode-btn'});
  if(TALK){if(!talk)TALK.stop();else TALK.refresh();}
}
function toggleMode(){MODE=MODE==='talk'?'text':'talk';applyMode();}
function setupTalk(){
  if(MODE==null)MODE=P.aiMode||'text';applyMode();
  if(!P.aiMode&&!ASKED){ASKED=true;EagleTalk.choose({title:tw('q'),sub:tw('sub'),talk:tw('talk'),type:tw('type'),noMic:tw('noMic'),onPick:m=>{MODE=m;if(m==='talk')setTimeout(()=>TALK&&TALK.walk(),150);P.aiMode=m;applyMode();fetch(`/api/crm-public/portal/${token}/ai-mode`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:m})}).catch(()=>{});}});}
}
let REC=null;
function mic(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;const b=document.getElementById('mic');if(REC){REC.stop();return;}
  const r=REC=new SR();r.lang=L==='es'?'es-US':'en-US';r.interimResults=true;const q=document.getElementById('q');const start=q.value?q.value+' ':'';
  r.onresult=e=>{let s='';for(const x of e.results)s+=x[0].transcript;q.value=start+s;grow(q);};r.onend=()=>{REC=null;b.classList.remove('rec');};b.classList.add('rec');r.start();}
document.getElementById('mic').hidden=!(window.SpeechRecognition||window.webkitSpeechRecognition);
async function answerCO(id,approve,btn){
  const out=document.getElementById('co-msg');btn.disabled=true;out.textContent='';
  try{const r=await fetch(`/api/crm-public/portal/${token}/change-orders/${id}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({approve,name:(document.getElementById('co-'+id)||{}).value})});const d=await r.json();if(!r.ok)throw new Error(d.error&&d.error.message);await load();}
  catch(e){out.textContent=e.message||t('cantSave');out.style.color='var(--err)';btn.disabled=false;}
}
async function choose(id,btn){
  const pick=document.querySelector(`input[name="sel-${id}"]:checked`);const out=document.getElementById('sel-msg');
  if(!pick){out.textContent=t('pickFirst');out.style.color='var(--err)';return;}
  btn.disabled=true;
  try{const r=await fetch(`/api/crm-public/portal/${token}/selections/${id}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({index:+pick.value})});const d=await r.json();if(!r.ok)throw new Error(d.error&&d.error.message);await load();const o=document.getElementById('sel-msg');if(o){o.textContent=d.over>0?t('savedOver',{a:money(d.over)}):t('saved');o.style.color='var(--ok)';}}
  catch(e){out.textContent=e.message||t('cantSave');out.style.color='var(--err)';btn.disabled=false;}

async function send(){
  const m=document.getElementById('m'),b=document.getElementById('mb'),out=document.getElementById('m-msg');
  if(!m.value.trim())return;b.disabled=true;out.textContent='';
  try{const r=await fetch(`/api/crm-public/portal/${token}/messages`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m.value})});const d=await r.json();if(!r.ok)throw new Error(d.error&&d.error.message);m.value='';out.textContent=t('sent');out.style.color='var(--ok)';}
  catch(e){out.textContent=e.message||t('cantSend');out.style.color='var(--err)';}
  b.disabled=false;
}
// Photos from a phone: HEIC (iPhone) becomes JPEG, and very large photos are
// shrunk, in the browser, before they're sent. Other files pass through.
async function prepFile(f){
  const heic=/image\/hei[cf]/i.test(f.type)||/\.hei[cf]$/i.test(f.name);
  const bigPhoto=/^image\/(jpeg|png|webp)$/i.test(f.type)&&f.size>4*1024*1024;
  if(!heic&&!bigPhoto)return f;
  let bmp;
  try{bmp=await createImageBitmap(f);}
  catch(e){if(heic)throw new Error(f.name+' is an iPhone HEIC photo this browser can’t open. On the iPhone: Settings → Camera → Formats → Most Compatible, or share it as JPEG.');return f;}
  const scale=Math.min(1,2560/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=Math.round(bmp.width*scale);c.height=Math.round(bmp.height*scale);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.85));
  if(!blob)return f;
  return new File([blob],f.name.replace(/\.[^.]+$/,'')+'.jpg',{type:'image/jpeg'});
}
function readFile(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f);});}
async function upload(input){
  const out=document.getElementById('up-msg');const files=[...input.files];if(!files.length)return;
  out.textContent=t('uploading',{n:files.length,s:pl(files.length)});out.style.color='';
  let ok=0;
  for(let f of files){
    try{f=await prepFile(f);}catch(e){out.textContent=e.message;out.style.color='var(--err)';continue;}
    if(f.size>8*1024*1024){out.textContent=t('tooBig',{f:f.name});continue;}
    try{const r=await fetch(`/api/crm-public/portal/${token}/files`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:f.name,dataBase64:await readFile(f)})});const d=await r.json();if(!r.ok)throw new Error(d.error&&d.error.message);ok++;}
    catch(e){out.textContent=e.message||t('upFail');out.style.color='var(--err)';}
  }
  if(ok){await load();const o=document.getElementById('up-msg');if(o){o.textContent=t('added',{n:ok,s:pl(ok),them:ok>1?'them':'it'});o.style.color='var(--ok)';}}
}
load();
