<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Eagle I — Choose an Account</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Exo+2:wght@400;500&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#04070e;--bg3:#0a1626;--bg4:#0f1f35;--bg5:#152845;--bdr2:rgba(30,140,255,.20);
--ink:#e0eaf8;--ink2:#6e96c0;--ink3:#2e5070;--blue:#1a7ee8;--blue2:#3aa0ff;--green:#00d97a;--red:#ff2d4a;
--fh:'Rajdhani',sans-serif;--fb:'Exo 2',sans-serif;--fm:'Share Tech Mono',monospace;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:480px;background:var(--bg3);border:1px solid var(--bdr2);border-radius:14px;padding:32px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
h1{font-family:var(--fh);font-size:22px;letter-spacing:1px;margin-bottom:6px}
.sub{font-family:var(--fm);font-size:10px;color:var(--blue2);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:20px}
.page-row{background:var(--bg5);border:1px solid var(--bdr2);border-radius:8px;padding:12px 14px;margin-bottom:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:border-color .15s}
.page-row:hover{border-color:var(--blue2)}
.page-name{font-size:14px;color:var(--ink)}
.page-go{font-family:var(--fm);font-size:9px;color:var(--blue2);text-transform:uppercase;letter-spacing:1px}
.err{color:var(--red);font-size:12px;margin-top:12px;text-align:center;display:none}
.status{font-family:var(--fm);font-size:11px;color:var(--ink2);margin-top:14px;text-align:center}
</style>
</head>
<body>
<div class="card">
  <h1 id="title">Choose an account to connect</h1>
  <div class="sub" id="sub">Loading...</div>
  <div id="rows"><div class="status">Loading...</div></div>
  <div class="err" id="err"></div>
</div>

<script>
// This page handles the "pick one" step for every OAuth flow in this app
// that can return more than one connectable account/page/location — Meta
// Pages (organic + ads re-auth), Google Ads customer accounts, and Google
// Business Profile locations. Which one loaded is read from ?provider=.
const PROVIDERS={
  meta:{
    title:'Choose a Page to connect', sub:'Your Facebook account manages more than one Page',
    listUrl:'/api/social/meta/pending-pages', listKey:'pages',
    rowLabel:p=>p.name, rowKey:p=>p.id,
    selectUrl:'/api/social/meta/select-page', selectBody:id=>({pageId:id}),
    redirectOnSuccess:'/?social_connected=facebook'
  },
  meta_ads:{
    title:'Choose a Page to connect', sub:'Your Facebook account manages more than one Page',
    listUrl:'/api/social/meta/pending-pages', listKey:'pages',
    rowLabel:p=>p.name, rowKey:p=>p.id,
    selectUrl:'/api/social/meta/select-page', selectBody:id=>({pageId:id}),
    redirectOnSuccess:'/?ads_connected=meta'
  },
  google_ads:{
    title:'Choose a Google Ads account', sub:'Your Google login manages more than one Ads account',
    listUrl:'/api/ads/google/pending-customers', listKey:'customerIds',
    rowLabel:id=>id, rowKey:id=>id,
    selectUrl:'/api/ads/google/select-customer', selectBody:id=>({customerId:id}),
    redirectOnSuccess:'/?ads_connected=google'
  },
  gbp:{
    title:'Choose a Business Profile location', sub:'Your Google login manages more than one location',
    listUrl:'/api/gbp/pending-locations', listKey:'options',
    rowLabel:o=>o.locationName||o.locationId, rowKey:o=>o.locationId,
    selectUrl:'/api/gbp/select-location', selectBody:id=>({locationId:id}),
    redirectOnSuccess:'/?gbp_connected=1'
  }
};
const provider=PROVIDERS[new URLSearchParams(window.location.search).get('provider')]||PROVIDERS.meta;

async function load(){
  document.getElementById('title').textContent=provider.title;
  document.getElementById('sub').textContent=provider.sub;
  const wrap=document.getElementById('rows');
  const err=document.getElementById('err');
  try{
    const r=await fetch(provider.listUrl);
    const d=await r.json();
    const items=d[provider.listKey]||[];
    if(!items.length){
      wrap.innerHTML='';
      err.textContent='No pending connection found — start again from the dashboard.';
      err.style.display='block';
      return;
    }
    wrap.innerHTML=items.map(item=>{
      const key=provider.rowKey(item).replace(/'/g,"\\'");
      return `<div class="page-row" onclick="choose('${key}')"><span class="page-name">${provider.rowLabel(item)}</span><span class="page-go">Connect →</span></div>`;
    }).join('');
  }catch(e){
    wrap.innerHTML='';
    err.textContent='Network error: '+e.message;
    err.style.display='block';
  }
}

async function choose(key){
  const err=document.getElementById('err');
  err.style.display='none';
  try{
    const r=await fetch(provider.selectUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(provider.selectBody(key))});
    const d=await r.json();
    if(!r.ok){
      err.textContent=d.error?.message||'Connection failed';
      err.style.display='block';
      return;
    }
    window.location.href=provider.redirectOnSuccess;
  }catch(e){
    err.textContent='Network error: '+e.message;
    err.style.display='block';
  }
}

load();
</script>
</body>
</html>
