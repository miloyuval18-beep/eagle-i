<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Invoice</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<!-- The homeowner's invoice page from Eagle I CRM (routes/crmPayments.js).
     Paying online goes through Stripe on the company's own account. -->
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#14202b;--ink2:#3a4855;--ink3:#55636f;--bdr:#c3ccd4;--accent:#1f4e79;--accent2:#173b5c;--ok:#2c6e49;--err:#a12a1f;--f:'Nunito Sans',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:22px 20px;margin-bottom:14px}
.co{font-size:14px;color:var(--ink3);overflow-wrap:anywhere}
.kind{font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--accent);margin-top:16px}
h1{font-size:21px;line-height:1.3;margin:4px 0;overflow-wrap:anywhere}
.amt{font-size:34px;font-weight:800;margin:14px 0 4px}
.meta{font-size:14px;color:var(--ink2)}
.note{white-space:pre-wrap;margin-top:12px;color:var(--ink2);font-size:15px}
.btn{display:flex;width:100%;justify-content:center;align-items:center;border:0;border-radius:10px;padding:15px 18px;font-family:var(--f);font-size:17px;font-weight:800;cursor:pointer;background:var(--accent);color:#fff;margin-top:18px}
.btn:hover{background:var(--accent2)}
.btn:disabled{opacity:.5}
.paid{margin-top:16px;padding:14px;border-radius:10px;background:rgba(44,110,73,.1);border:1px solid var(--ok);font-size:16px}
.err{color:var(--err);font-size:14px;margin-top:10px;min-height:18px}
.small{font-size:13px;color:var(--ink3);margin-top:10px}
.foot{font-size:12px;color:var(--ink3);text-align:center;margin:12px 0 30px}
</style>
</head>
<body>
<div class="wrap"><div class="card" id="app">Loading…</div><div class="foot">Sent with Eagle I CRM</div></div>
<script>
const token=location.pathname.split('/').pop();
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtDate=d=>d?new Date(String(d).slice(0,10)+'T12:00:00Z').toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}):'';
function render(i){
  const c=i.company||{};
  document.title=`Invoice #${i.number} from ${c.name||''}`;
  let action='';
  if(i.status==='paid')action=`<div class="paid">✓ <b>Paid</b> ${i.paidAmount!=null?money(i.paidAmount):''} on ${new Date(i.paidAt).toLocaleDateString('en-US',{month:'long',day:'numeric'})}. Thank you!</div>`;
  else if(i.status==='void')action='<div class="small">This invoice was cancelled. Nothing is owed on it.</div>';
  else if(i.payOnline)action=`<button class="btn" id="pay" onclick="pay()">Pay ${money(i.amount)}</button><div class="small">Pay by card, or by bank transfer (free for larger amounts, takes a few days to clear). Payments go directly to ${esc(c.name)} through Stripe.</div><div class="err" id="err" role="alert"></div>`;
  else action=`<div class="small">To pay, contact ${esc(c.name)}${c.phone?' at '+esc(c.phone):''}${c.email?' or '+esc(c.email):''}.</div>`;
  document.getElementById('app').innerHTML=`<div class="co">${esc(c.name)}${c.address?' · '+esc(c.address):''}</div>
    <div class="kind">${esc(i.kind)} · Invoice #${esc(i.number)}</div>
    <h1>${esc(i.title)}</h1>
    <div class="meta">For ${esc(i.customer)} · ${esc(i.project)}</div>
    <div class="amt">${money(i.amount)}</div>
    ${i.dueDate&&i.status!=='paid'?`<div class="meta">Due ${fmtDate(i.dueDate)}</div>`:''}
    ${i.note?`<div class="note">${esc(i.note)}</div>`:''}
    ${action}`;
}
async function load(){
  const session=new URLSearchParams(location.search).get('session');
  try{
    const r=await fetch('/api/crm-public/invoices/'+token+(session?'?session='+encodeURIComponent(session):''));const d=await r.json();
    if(!r.ok)throw new Error((d.error&&d.error.message)||'This invoice link is not valid.');
    render(d.invoice);
    if(session)history.replaceState(null,'',location.pathname);
  }catch(e){document.getElementById('app').textContent=e.message;}
}
async function pay(){
  const b=document.getElementById('pay'),err=document.getElementById('err');b.disabled=true;err.textContent='';
  try{const r=await fetch(`/api/crm-public/invoices/${token}/checkout`,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});const d=await r.json();if(!r.ok)throw new Error(d.error&&d.error.message);location.href=d.url;}
  catch(e){err.textContent=e.message||'Could not start the payment. Please try again.';b.disabled=false;}
}
load();
</script>
</body>
</html>
