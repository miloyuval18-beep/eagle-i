<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Eagle I — Reset Password</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf9f6;--bg-card:#ffffff;--bg-soft:#f1efea;
  --ink:#262421;--ink2:#5b5750;--ink3:#726d63;
  --bdr:#e3e0da;--bdr2:#cfcbc3;--bdr-strong:#262421;
  --f:'Nunito Sans',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;-webkit-font-smoothing:antialiased}
.card{width:100%;max-width:420px;background:var(--bg-card);border:1px solid var(--bdr);border-radius:14px;padding:32px;box-shadow:0 2px 4px rgba(38,36,33,.04),0 8px 24px rgba(38,36,33,.07)}
h1{font-size:24px;font-weight:800;letter-spacing:.2px;margin-bottom:6px}
.sub{font-size:15px;color:var(--ink3);margin-bottom:24px}
label{display:block;font-size:14px;font-weight:600;color:var(--ink2);margin:14px 0 6px}
input{width:100%;background:#fff;border:1.5px solid var(--bdr2);border-radius:8px;padding:12px 13px;font-family:var(--f);font-size:16px;color:var(--ink);outline:none}
input:focus{border-color:var(--bdr-strong);box-shadow:0 0 0 3px rgba(38,36,33,.08)}
button.primary{width:100%;margin-top:22px;background:var(--ink);color:#fff;border:none;border-radius:8px;padding:14px;font-family:var(--f);font-size:16px;font-weight:700;cursor:pointer}
button.primary:hover{background:#000}
button.primary:disabled{opacity:.5;cursor:not-allowed}
.err{color:var(--ink);background:var(--bg-soft);border:1px solid var(--bdr2);border-radius:8px;padding:10px 12px;font-size:14px;font-weight:600;margin-top:14px;text-align:center;display:none}
.err::before{content:'⚠ '}
.status{font-size:15px;font-weight:600;color:var(--ink);background:var(--bg-soft);border:1px solid var(--bdr2);border-radius:8px;padding:12px;margin-top:16px;text-align:center;display:none}
.status::before{content:'✓ '}
a{color:var(--ink2);font-size:15px;text-decoration:underline;display:block;text-align:center;margin-top:18px}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
</style>
</head>
<body>
<div class="card">
  <h1>Reset your password</h1>
  <div class="sub">Enter your account email</div>
  <form id="form">
    <label>Email</label>
    <input type="email" id="email" required autocomplete="email">
    <button class="primary" type="submit" id="submitBtn">Send Reset Link</button>
  </form>
  <div class="status" id="status">If an account exists for that email, a reset link is on its way.</div>
  <div class="err" id="err"></div>
  <a href="/login.html">Back to sign in</a>
</div>
<script>
document.getElementById('form').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const btn=document.getElementById('submitBtn');
  const status=document.getElementById('status');
  const err=document.getElementById('err');
  err.style.display='none';
  btn.disabled=true;
  const email=document.getElementById('email').value;
  try{
    await fetch('/api/auth/request-password-reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});
    status.style.display='block';
    document.getElementById('form').style.display='none';
  }catch(e){
    err.textContent='Network error: '+e.message;
    err.style.display='block';
    btn.disabled=false;
  }
});
</script>
</body>
</html>
