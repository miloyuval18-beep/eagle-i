<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>How Is It Going</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f8;--card:#ffffff;--soft:#eef1f4;
  --ink:#14202b;--ink2:#3a4855;--ink3:#55636f;
  --bdr:#c3ccd4;--bdr2:#8794a0;--accent:#1f4e79;--accent2:#173b5c;--err:#a12a1f;
  --f:'Nunito Sans',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:18.5px;line-height:1.5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;-webkit-font-smoothing:antialiased}
.card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:28px 24px;box-shadow:0 2px 4px rgba(20,32,43,.04),0 10px 28px rgba(20,32,43,.08)}
.brand{font-size:26px;font-weight:800;text-align:center;color:var(--ink)}
.brand span{color:var(--accent)}
.tag{font-size:17px;color:var(--ink3);text-align:center;margin:4px 0 20px}
.tabs{display:flex;gap:4px;margin-bottom:16px;background:var(--soft);border-radius:9px;padding:4px}
.tab{flex:1;text-align:center;padding:10px;border-radius:6px;cursor:pointer;font-size:17.5px;font-weight:700;color:var(--ink3);border:0;background:transparent;font-family:var(--f)}
.tab.active{background:var(--accent);color:#fff}
label{display:block;font-size:16px;font-weight:700;color:var(--ink2);margin:12px 0 5px}
input{width:100%;background:#fff;border:1.5px solid var(--bdr2);border-radius:8px;padding:12px 13px;font-family:var(--f);font-size:18.5px;color:var(--ink);outline:none}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,78,121,.12)}
.check{display:flex;gap:8px;align-items:flex-start;margin-top:14px;font-size:16px;color:var(--ink2)}
.check input{width:18px;height:18px;margin-top:2px;flex:0 0 auto}
.check a,.forgot{color:var(--accent)}
.btn{width:100%;margin-top:18px;padding:13px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-family:var(--f);font-size:18.5px;font-weight:800;cursor:pointer}
.btn:hover{background:var(--accent2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.err{color:var(--err);font-size:17px;margin-top:10px;min-height:20px}
.forgot{display:inline-block;margin-top:10px;font-size:17px}
.foot{font-size:16px;color:var(--ink3);text-align:center;margin-top:18px}
.foot a{color:var(--ink2)}
[hidden]{display:none!important}
.opt{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1.5px solid var(--bdr2);border-radius:10px;margin-top:8px;cursor:pointer;font-size:17.5px}
.opt input{width:18px;height:18px;flex:0 0 auto}
.opt:has(input:checked){border-color:var(--accent);background:rgba(31,78,121,.06)}
textarea{width:100%;background:#fff;border:1.5px solid var(--bdr2);border-radius:8px;padding:12px 13px;font-family:var(--f);font-size:18.5px;color:var(--ink);outline:none;resize:vertical}
.q{font-weight:800;font-size:17.5px;margin-top:18px}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-top:10px}
.day{flex:0 0 auto;border:1.5px solid var(--bdr2);border-radius:10px;padding:8px 10px;text-align:center;cursor:pointer;background:#fff;font-family:var(--f);font-size:16px;color:var(--ink)}
.day.on{border-color:var(--accent);background:var(--accent);color:#fff}
.times{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.time{border:1.5px solid var(--bdr2);border-radius:8px;padding:10px 4px;text-align:center;cursor:pointer;background:#fff;font-family:var(--f);font-size:17.5px;color:var(--ink)}
.time.on{border-color:var(--accent);background:rgba(31,78,121,.1);font-weight:800}
.ok{font-size:18.5px;text-align:center;padding:16px 0}
.hp{position:absolute;left:-5000px;width:1px;height:1px;overflow:hidden}
[hidden]{display:none!important}
.lang{display:block;margin:-12px -8px 4px auto;background:none;border:0;color:var(--accent);font-family:var(--f);font-size:17px;font-weight:700;cursor:pointer;padding:6px 8px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.sc{border:1.5px solid var(--bdr2);border-radius:10px;padding:14px 0;text-align:center;font-family:var(--f);font-size:22px;font-weight:800;background:#fff;color:var(--ink);cursor:pointer}
.sc.on{border-color:var(--accent);background:var(--accent);color:#fff}
.ends{display:flex;justify-content:space-between;font-size:15px;color:var(--ink3);margin-top:6px}
</style>
<link rel="stylesheet" href="/eaglei-theme.css">
</head>
<body>
<main class="card">
  <button type="button" class="lang" id="lang-btn" onclick="toggleLang()">Español</button>
  <div class="brand" id="co" style="font-size:22px">…</div>
  <div class="tag" id="tag"></div>
  <div id="f" hidden>
    <div class="q" id="ask"></div>
    <div class="scale" id="scale"></div>
    <div class="ends"><span id="lo"></span><span id="hi"></span></div>
    <div class="q" id="cq" style="margin-top:20px"></div><textarea id="comment" rows="3"></textarea>
    <button class="btn" id="b" onclick="save()"></button><div class="err" id="err" role="alert"></div>
  </div>
  <div id="done" hidden class="ok"></div>
</main>
<script>
(()=>{const f=window.fetch.bind(window);window.fetch=(u,o={})=>{try{if(String(u).startsWith('/api/crm-public')&&typeof L!=='undefined'&&L==='es')o={...o,headers:{...(o.headers||{}),'X-Lang':'es'}};}catch(e){}return f(u,o);};})();

const token=location.pathname.split('/').pop();
const T={en:{ask:'How is your project going so far?',lo:'1 = Not happy',hi:'5 = Very happy',cq:'Anything you’d like the team to know? (optional)',send:'Send',thanks:'Thank you! The team has your answer.',thanksLow:'Thank you for telling us. Someone from the team will reach out soon to make it right.',invalid:'This link is not valid.',pick:'Tap a number first.',oops:'Something went wrong. Please try again.'},
es:{ask:'¿Cómo va su proyecto hasta ahora?',lo:'1 = Nada contento',hi:'5 = Muy contento',cq:'¿Algo que quiera que el equipo sepa? (opcional)',send:'Enviar',thanks:'¡Gracias! El equipo ya tiene su respuesta.',thanksLow:'Gracias por decirnos. Alguien del equipo se comunicará pronto para arreglarlo.',invalid:'Este enlace no es válido.',pick:'Primero toque un número.',oops:'Algo salió mal. Por favor intente de nuevo.'}};
let L=(()=>{try{const s=localStorage.getItem('eaglei_lang');if(s)return s;}catch(e){}return /^es/i.test(navigator.language||'')?'es':'en';})();
let chosen=false;try{chosen=!!localStorage.getItem('eaglei_lang');}catch(e){}
const t=k=>(T[L]||T.en)[k]||T.en[k];
let D=null,score=null;
function render(){
  document.documentElement.lang=L;document.getElementById('lang-btn').textContent=L==='es'?'English':'Español';
  if(!D)return;
  document.getElementById('co').textContent=D.company;document.getElementById('tag').textContent=D.title;
  document.getElementById('ask').textContent=t('ask');document.getElementById('lo').textContent=t('lo');document.getElementById('hi').textContent=t('hi');
  document.getElementById('cq').textContent=t('cq');document.getElementById('b').textContent=t('send');
  document.getElementById('scale').innerHTML=[1,2,3,4,5].map(n=>`<button class="sc${n===score?' on':''}" onclick="pick(${n})" aria-label="${n}">${n}</button>`).join('');
}
function toggleLang(){L=L==='es'?'en':'es';try{localStorage.setItem('eaglei_lang',L);}catch(e){}render();}
async function post(body){const r=await fetch('/api/crm-public/pulse/'+token,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw new Error((d.error&&d.error.message)||t('oops'));return d;}
async function pick(n){score=n;render();try{await post({score:n});}catch(e){document.getElementById('err').textContent=e.message;}}
async function save(){
  const err=document.getElementById('err');err.textContent='';if(!score){err.textContent=t('pick');return;}
  const b=document.getElementById('b');b.disabled=true;
  try{await post({score,comment:document.getElementById('comment').value});document.getElementById('f').hidden=true;const d=document.getElementById('done');d.hidden=false;d.textContent=score<=3?t('thanksLow'):t('thanks');}
  catch(e){err.textContent=e.message;b.disabled=false;}
}
render();
fetch('/api/crm-public/pulse/'+token).then(r=>r.json().then(d=>{if(!r.ok)throw new Error(d.error&&d.error.message);
  D=d;if(d.lang==='es'&&!chosen)L='es';score=d.score||null;
  if(d.comment)document.getElementById('comment').value=d.comment;
  document.getElementById('f').hidden=false;render();
  const s=parseInt(new URLSearchParams(location.search).get('s'),10);if(s>=1&&s<=5){pick(s);history.replaceState(null,'',location.pathname);}
})).catch(e=>{document.getElementById('tag').textContent=e.message||t('invalid');});
</script>
</body>
</html>
